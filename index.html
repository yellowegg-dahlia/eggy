      'data-act="vocab-flip" data-id="' + b.id + '" aria-label="点一下看释义">' +
      '<span class="vb-side">' + langName + ' · 第 ' + (i + 1) + ' / ' + list.length + ' 个' +
        (isKnown ? ' · 已记住' : '') + '</span>' +
      (vocabFlipped
        ? '<span class="vb-mean">' + esc(w[1]) + '</span>' +
          (w[2] ? '<span class="vb-phon">' + esc(w[2]) + '</span>' : '')
        : '<span class="vb-word">' + esc(w[0]) + '</span>') +
      '<span class="vb-tip small muted">' + (vocabFlipped ? '点词卡翻回正面' : '点一下，看释义') + '</span>' +
    '</button>';

  var ctrl = '<div class="vb-ctrl">' +
      '<button class="btn" data-act="vocab-no" data-id="' + b.id + '">还没记住，下一个</button>' +
      '<button class="btn primary" data-act="vocab-yes" data-id="' + b.id + '">记住了，下一个</button>' +
    '</div>';

  var pct = Math.round(st.known / st.total * 100);
  var prog = '<div class="vb-prog">' +
      '<div class="vb-prog-row"><span>已记住</span><b>' + st.known + ' / ' + st.total + '</b><i>' + pct + '%</i></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<button class="btn small ghost vb-reset" data-act="vocab-reset" data-id="' + b.id + '">重置' + langName + '进度</button>' +
    '</div>';

  return '<section class="card vb-card-wrap">' +
      '<div class="card-head"><h2>背单词</h2>' + langSwitch + '</div>' +
      card + ctrl + prog +
      '<p class="small muted vb-hint">每天背一点，词库来自你给的两份单词表：英语 ' + (WORDS.en||[]).length + ' 词 · 西班牙语 ' + (WORDS.es||[]).length + ' 词。</p>' +
    '</section>';
}
function vocabForm(b){
  var d = b.data, id = b.id;
  var stEn = vocabStats({ lang:'en', known:d.known, seq:d.seq });
  var stEs = vocabStats({ lang:'es', known:d.known, seq:d.seq });
  return '<div class="form-grid">' +
      fieldRow('默认词库',
        '<select data-b="' + id + '" data-p="data.lang">' +
          '<option value="en"' + (d.lang === 'en' ? ' selected' : '') + '>英语</option>' +
          '<option value="es"' + (d.lang === 'es' ? ' selected' : '') + '>西班牙语</option>' +
        '</select>') +
    '</div>' +
    '<p class="muted small">词库内置在文件里：英语 ' + stEn.total + ' 词（已记 ' + stEn.known + '），西班牙语 ' + stEs.total + ' 词（已记 ' + stEs.known + '）。背词和打分都在前台点。</p>';
}

var trOpen = {};      /* 每个板块是否展开月历 */
var trOffset = {};    /* 每个板块的月份偏移 */
function viewTracker(b){
  /* 前台把所有数值追踪板块合成一个面板：上面是每项的「今天」快捷输入，下面是当前这项的 7 天 + 月历 */
  var all = state.blocks.filter(function(x){ return x.type === 'tracker'; });
  if(!all.length) all = [b];
  var d = b.data, days = lastDays(7), t = todayYmd();
  var target = Number(d.target) || 0;
  var low = Number(d.lowAt) || 0;
  var nums = [];
  days.forEach(function(x){
    var v = d.records[x];
    if(typeof v === 'number' && isFinite(v)) nums.push(v);
  });
  var peak = nums.length ? Math.max.apply(null, nums) : 0;
  var scale = Math.max(target, low, peak, 1) * 1.2;

  var plot = '<div class="tr-plot">' +
    '<div class="tr-line" style="bottom:' + (target > 0 ? (target / scale * 100) : 0) + '%">' +
      '<span>目标 ' + target + ' ' + esc(d.unit) + '</span></div>' +
    '<div class="tr-cols">' + days.map(function(x){
      var v = d.records[x];
      var has = typeof v === 'number' && isFinite(v);
      var isLow = has && low > 0 && v < low;
      var h = has ? Math.max(3, v / scale * 100) : 0;
      return '<div class="tr-col">' +
        '<div class="tr-bar' + (isLow ? ' low' : '') + '" style="height:' + h + '%">' +
          (has ? '<span class="tr-val">' + v + '</span>' : '') +
        '</div></div>';
    }).join('') + '</div>' +
  '</div><div class="tr-axis">' + days.map(function(x){
    var dt = parseYmd(x);
    return '<span' + (x === t ? ' class="now"' : '') + '>' + (dt ? (dt.getMonth() + 1) + '/' + dt.getDate() : '') + '</span>';
  }).join('') + '</div>';

  var tabs = all.length > 1 ? '<div class="vb-langs tr-tabs">' + all.map(function(x){
      return '<a class="vb-lang' + (x.id === b.id ? ' on' : '') + '" href="#/b/' + x.id + '" ' +
        'title="看「' + esc(x.data.label || x.title) + '」的曲线和月历">' +
        esc(x.data.label || x.title || '追踪') + '</a>';
    }).join('') + '</div>' : '';

  var todayRow = '<div class="tr-today-all">' + all.map(function(x){
    var v = x.data.records[t];
    var lab = x.data.label || x.title || '今天';
    return '<label class="tr-day"><span>' + esc(lab) + '</span>' +
      '<input type="number" step="0.1" inputmode="decimal" data-b="' + x.id + '" data-p="data.records.' + t + '" data-refresh="1" ' +
        'value="' + (typeof v === 'number' ? v : '') + '" placeholder="—" aria-label="今天的' + esc(lab) + '">' +
      '<span>' + esc(x.data.unit) + '</span></label>';
  }).join('') + '</div>';

  var open = !!trOpen[b.id];
  var monthHtml = '';
  if(open){
    var base = new Date();
    base.setDate(1);
    base.setMonth(base.getMonth() + (trOffset[b.id] || 0));
    var y = base.getFullYear(), m = base.getMonth();
    var firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    var total = new Date(y, m + 1, 0).getDate();
    var cells = '';
    for(var i = 0; i < firstDow; i++) cells += '<div class="tr-cell blank"></div>';
    for(var day = 1; day <= total; day++){
      var ds = y + '-' + pad(m + 1) + '-' + pad(day);
      var v = d.records[ds];
      var has = typeof v === 'number' && isFinite(v);
      var isLow = has && low > 0 && v < low;
      var future = ds > t;
      cells += '<button class="tr-cell' + (has ? ' on' : '') + (isLow ? ' low' : '') +
        (ds === t ? ' today' : '') + '" data-act="tr-day" data-id="' + b.id + '" data-d="' + ds + '"' +
        (future ? ' disabled' : '') + ' aria-label="' + ds + (has ? ' ' + v + ' ' + esc(d.unit) : '') + '">' +
        '<span class="tr-cd">' + day + '</span>' +
        (has ? '<b class="tr-cv">' + v + '</b>' : '') +
      '</button>';
    }
    var monthAvg = 0, monthN = 0;
    Object.keys(d.records).forEach(function(k){
      if(k.slice(0, 7) === (y + '-' + pad(m + 1)) && typeof d.records[k] === 'number'){ monthAvg += d.records[k]; monthN++; }
    });
    monthHtml = '<div class="tr-month">' +
      '<div class="gym-nav">' +
        '<button class="icon-btn" data-act="tr-prev" data-id="' + b.id + '" aria-label="上个月">←</button>' +
        '<span class="gym-ym">' + y + '/' + pad(m + 1) + '</span>' +
        '<button class="icon-btn" data-act="tr-next" data-id="' + b.id + '" aria-label="下个月">→</button>' +
        ((trOffset[b.id] || 0) !== 0 ? '<button class="btn small" data-act="tr-now" data-id="' + b.id + '">回到本月</button>' : '') +
      '</div>' +
      '<div class="gym-week">' + ['一','二','三','四','五','六','日'].map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>' +
      '<div class="tr-grid">' + cells + '</div>' +
      (monthN ? '<p class="small muted tr-mhint">' + y + ' 年 ' + (m + 1) + ' 月：记了 ' + monthN + ' 天 · 平均 ' +
        (Math.round(monthAvg / monthN * 10) / 10) + ' ' + esc(d.unit) + '</p>' : '') +
      '<p class="small muted tr-mhint">点格子里的日期可以补记 / 修改 / 清除那一天的数</p>' +
    '</div>';
  }

  return '<section class="card">' +
    '<div class="card-head"><h2>数值追踪</h2>' +
      '<span class="hint">' + (all.length > 1 ? all.length + ' 项合在一起 · ' : '') + (open ? '最近 7 天 + 月历' : '最近 7 天') + '</span></div>' +
    tabs +
    '<div class="tr-wrap">' + plot + '</div>' +
    todayRow +
    '<div class="tr-toggle-row">' +
      '<button class="btn small ghost" data-act="tr-toggle" data-id="' + b.id + '">' +
        (open ? '收起月历' : '展开整个月的记录') + '</button>' +
    '</div>' +
    monthHtml +
  '</section>';
}


/* ---------- 人物树 ---------- */
function birthdayInfo(md, today){
  var m = /^(\d{1,2})-(\d{1,2})$/.exec(md || '');
  if(!m) return null;
  var t = parseYmd(today);
  if(!t) return null;
  var mm = Number(m[1]), dd = Number(m[2]);
  var next = new Date(t.getFullYear(), mm - 1, dd);
  if(isNaN(next.getTime())) return null;
  var gap = diffDays(today, ymd(next));
  if(gap < 0) gap = diffDays(today, ymd(new Date(t.getFullYear() + 1, mm - 1, dd)));
  return { label: mm + ' 月 ' + dd + ' 日', days: gap };
}

function peopleRows(d, t){
  return d.list.slice().sort(function(a, c){
    var sa = a.last ? diffDays(a.last, t) : 99999;
    var sc = c.last ? diffDays(c.last, t) : 99999;
    return sc - sa;
  });
}
function personNode(b, p, t, style){
  var since = p.last ? diffDays(p.last, t) : null;
  var over = since !== null && since > b.data.staleDays;
  var bd = birthdayInfo(p.birthday, t);
  var meta = since === null
    ? '还没记录联系'
    : (since === 0 ? '今天联系过' : (over ? since + ' 天没联系' : since + ' 天前'));
  return '<button class="pp-node' + (over ? ' over' : '') + '" style="' + style + '" ' +
      'data-act="person-card" data-id="' + b.id + '" data-pid="' + p.id + '" ' +
      'title="' + esc((p.note || '') + (bd ? ' · 生日 ' + bd.label : '')) + '">' +
    '<span class="pp-node-name">' + (esc(p.name) || '未命名') + '</span>' +
    (p.relation ? '<span class="pp-node-rel">' + esc(p.relation) + '</span>' : '') +
    '<span class="pp-node-meta">' + meta + '</span>' +
    (bd ? '<span class="pp-node-bd">生日 ' + bd.label + '</span>' : '') +
  '</button>';
}
function viewPeople(b){
  var d = b.data, t = todayYmd();
  var rows = peopleRows(d, t);
  var due = rows.filter(function(p){ return p.last && diffDays(p.last, t) > d.staleDays; }).length;

  var head = '<section class="card pp-card-wrap">' +
    '<div class="card-head">' +
      '<h2>重要的人</h2>' +
      '<div class="pp-head-right">' +
        '<span class="hint">' + (rows.length
          ? (due ? due + ' 位超过 ' + d.staleDays + ' 天没联系' : '都还保持着联系')
          : '还没有人') + '</span>' +
        '<button class="btn small primary" data-act="person-add" data-id="' + b.id + '">+ 加一个人</button>' +
      '</div>' +
    '</div>';

  if(!rows.length){
    return head +
      '<div class="pp-tree-empty">' +
        '<div class="pp-center solo"><span class="pp-center-egg">' + eggIcon('whole') + '</span></div>' +
        '<p class="muted">还没有人。点右上角「加一个人」，他会出现在这棵树上。</p>' +
      '</div></section>';
  }

  /* 以蛋为中心放射：人多就分内外两圈 */
  var n = rows.length;
  var twoRings = n > 8;
  var nodes = '', links = '';
  var cx = 50, cy = 50;

  rows.forEach(function(p, i){
    var ring, idx, count;
    if(twoRings){
      ring = i % 2 === 0 ? 1 : 0;      /* 外圈 / 内圈 交替 */
      idx = Math.floor(i / 2);
      count = ring === 1 ? Math.ceil(n / 2) : Math.floor(n / 2);
    }else{
      ring = 1; idx = i; count = n;
    }
    var rx = ring === 1 ? 37 : 21;
    var ry = ring === 1 ? 33 : 19;
    var start = ring === 1 ? -90 : (-90 + 180 / Math.max(count, 1));
    var ang = (start + (360 / Math.max(count, 1)) * idx) * Math.PI / 180;
    var x = cx + Math.cos(ang) * rx;
    var y = cy + Math.sin(ang) * ry;
    var over = p.last && diffDays(p.last, t) > d.staleDays;

    nodes += personNode(b, p, t, 'left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%');

    /* 一条从蛋到节点的弧线 */
    var mx = (cx + x) / 2, my = (cy + y) / 2;
    var bend = ring === 1 ? 8 : 5;
    var qx = mx + (my - cy) * 0.14 * bend / 5;
    var qy = my - (mx - cx) * 0.14 * bend / 5;
    links += '<path class="pp-link' + (over ? ' over' : '') + '" d="M' + cx + ' ' + cy +
      ' Q' + qx.toFixed(2) + ' ' + qy.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + '"/>';
  });

  var tree = '<div class="pp-tree">' +
    '<svg class="pp-links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' + links + '</svg>' +
    '<div class="pp-center">' +
      '<span class="pp-center-egg">' + eggIcon('whole') + '</span>' +
      '<span class="pp-center-label">我</span>' +
    '</div>' + nodes +
  '</div>';

  /* 窄屏用一列卡片，读起来更省力 */
  var list = '<div class="pp-list-m">' + rows.map(function(p){
    var since = p.last ? diffDays(p.last, t) : null;
    var over = since !== null && since > d.staleDays;
    var bd = birthdayInfo(p.birthday, t);
    return '<div class="pp-card' + (over ? ' over' : '') + '">' +
      '<div class="pp-main">' +
        '<div class="pp-name">' + (esc(p.name) || '未命名') +
          (p.relation ? ' <span class="tag">' + esc(p.relation) + '</span>' : '') + '</div>' +
        '<div class="pp-meta">' +
          (since === null ? '还没记录上次联系' : '上次联系 ' + (since === 0 ? '今天' : since + ' 天前')) +
          (bd ? ' · 生日 ' + bd.label + (bd.days === 0 ? '（今天）' : '（还有 ' + bd.days + ' 天）') : '') +
        '</div>' +
        (p.note ? '<div class="pp-note">' + esc(p.note) + '</div>' : '') +
      '</div>' +
      '<div class="pp-side">' +
        (over ? '<span class="pp-warn">' + since + ' 天没联系</span>' : '') +
        '<button class="btn small" data-act="touch-person" data-id="' + b.id + '" data-pid="' + p.id + '">刚联系过</button>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  return head + tree + list +
    '<p class="pp-legend small muted">点一个人看备注；变红的是太久没联系了。</p>' +
  '</section>';
}

/* ---------- 健身记录 ---------- */
var gymOffset = 0;
var gymEditing = '';   /* 当前展开编辑的那一天 */
function gymRec(b, ds){
  if(!isObj(b.data.days)) b.data.days = {};
  if(!isObj(b.data.days[ds])) b.data.days[ds] = { tags:[], kinds:[], hours:0 };
  var r = b.data.days[ds];
  if(!Array.isArray(r.tags)) r.tags = [];
  if(!Array.isArray(r.kinds)) r.kinds = [];
  if(typeof r.hours !== 'number') r.hours = 0;
  return r;
}
function gymKindChip(bid, ds, g, n, on){
  var cls = 'chip gk' + (g === 'strength' ? ' gk-s' : ' gk-a') + (on ? ' on' : '');
  return '<button class="' + cls + '" data-act="gym-kind" data-id="' + bid + '" data-d="' + ds + '" ' +
    'data-g="' + g + '" data-n="' + esc(n) + '">' + esc(n) + '</button>';
}
function viewGym(b){
  var d = b.data, t = todayYmd();
  var base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + gymOffset);
  var y = base.getFullYear(), m = base.getMonth();
  var firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
  var total = new Date(y, m + 1, 0).getDate();
  var isThisMonth = (gymOffset === 0);

  var cells = '';
  for(var i = 0; i < firstDow; i++) cells += '<div class="gym-cell blank"></div>';
  for(var day = 1; day <= total; day++){
    var ds = y + '-' + pad(m + 1) + '-' + pad(day);
    var rec = d.days[ds];
    var on = gymDone(rec);
    var isToday = ds === t;
    var future = ds > t;
    var sum = on ? gymSummary(rec) : '';
    var tagChips = (rec && rec.tags && rec.tags.length) ? rec.tags.map(function(tid){
        var tg = d.tags.filter(function(x){ return x.id === tid; })[0];
        if(!tg) return '';
        return '<span class="gym-tagchip" style="background:' + tg.color + '2b;border-color:' + tg.color + '99;color:' + tg.color + '">' +
          esc(tg.label) + '</span>';
      }).join('') : '';
    cells += '<button class="gym-cell' + (on ? ' on' : '') + (isToday ? ' today' : '') +
        (gymEditing === ds ? ' editing' : '') + '" ' +
      'data-act="gym-open" data-id="' + b.id + '" data-d="' + ds + '"' + (future ? ' disabled' : '') +
      ' aria-label="' + ds + (on ? ' 已健身 ' + sum : ' 未记录') + '">' +
      '<span class="gym-num">' + day + '</span>' +
      (on ? '<span class="gym-mark">' + DUMBBELL +
        (rec.hours ? '<i>' + rec.hours + 'h</i>' : '') + '</span>' : '') +
      (tagChips ? '<span class="gym-tags">' + tagChips + '</span>' : '') +
      (on && rec.kinds.length ? '<span class="gym-kinds">' +
        esc(rec.kinds.map(function(k){ return k.n; }).join(' · ')) + '</span>' : '') +
    '</button>';
  }

  var monthCount = Object.keys(d.days).filter(function(k){
    return k.slice(0, 7) === y + '-' + pad(m + 1) && gymDone(d.days[k]);
  }).length;

  var panel = '';
  if(gymEditing){
    var dr = d.days[gymEditing] || { tags:[], kinds:[], hours:0 };
    if(!Array.isArray(dr.tags)) dr.tags = [];
    if(!Array.isArray(dr.kinds)) dr.kinds = [];
    var isTodayEdit = gymEditing === t;
    var sumParts = gymSummary({ tags:dr.tags, kinds:dr.kinds, hours:dr.hours });

    panel = '<div class="gym-panel">' +
      '<div class="gym-p-head">' +
        '<div><b>' + esc(fmtMD(gymEditing)) + '</b>' +
          '<span class="muted small"> · ' + weekday(gymEditing) + (isTodayEdit ? ' · 今天' : '') + '</span></div>' +
        '<button class="icon-btn" data-act="gym-close" aria-label="收起">×</button>' +
      '</div>' +

      '<div class="gym-sec">' +
        '<span class="gym-sec-t">标签</span>' +
        '<div class="gym-sec-c">' + (d.tags.length ? d.tags.map(function(tg){
          return chipsToggle(b.id, tg, dr.tags.indexOf(tg.id) >= 0, 'gym-tag',
            'data-t="' + tg.id + '" data-d="' + gymEditing + '" ');
        }).join('') : '<span class="small muted">去后台加几个标签</span>') + '</div>' +
      '</div>' +

      ['aerobic','strength'].map(function(g){
        var list = d.kinds[g] || [];
        return '<div class="gym-sec g-sec-' + g + '">' +
          '<span class="gym-sec-t">' + GYM_GROUP_NAME[g] + '</span>' +
          '<div class="gym-sec-c">' + (list.length ? list.map(function(n){
            var on = dr.kinds.some(function(k){ return k.g === g && k.n === n; });
            return gymKindChip(b.id, gymEditing, g, n, on);
          }).join('') : '<span class="small muted">去后台填种类</span>') + '</div>' +
        '</div>';
      }).join('') +

      '<div class="gym-sec">' +
        '<span class="gym-sec-t">时长</span>' +
        '<div class="gym-sec-c">' + [1,2,3,4,5].map(function(hr){
          return '<button class="chip gh' + (dr.hours === hr ? ' on' : '') + '" data-act="gym-hours" ' +
            'data-id="' + b.id + '" data-d="' + gymEditing + '" data-h="' + hr + '">' + hr + ' 小时</button>';
        }).join('') + '</div>' +
      '</div>' +

      '<div class="gym-p-foot">' +
        '<span class="gym-p-sum">' + (sumParts ? '已记：' + esc(sumParts) : '还没选，点上面任意一项就记下了') + '</span>' +
        '<button class="btn small ghost" data-act="gym-clear" data-id="' + b.id + '" data-d="' + gymEditing + '">清空这天</button>' +
      '</div>' +
    '</div>';
  }

  return '<section class="card">' +
    '<div class="card-head"><h2>健身 · ' + y + ' 年 ' + (m + 1) + ' 月</h2>' +
      '<span class="hint">打卡 ' + monthCount + ' 天</span></div>' +
    '<div class="gym-nav">' +
      '<button class="icon-btn" data-act="gym-prev" aria-label="上个月">←</button>' +
      '<span class="gym-ym">' + y + '/' + pad(m + 1) + '</span>' +
      '<button class="icon-btn" data-act="gym-next" aria-label="下个月">→</button>' +
      (isThisMonth ? '' : '<button class="btn small" data-act="gym-now">回到本月</button>') +
    '</div>' +
    '<div class="gym-week">' + ['一','二','三','四','五','六','日'].map(function(x){
      return '<span>' + x + '</span>';
    }).join('') + '</div>' +
    '<div class="gym-grid">' + cells + '</div>' +
    '<p class="gym-hint small muted">点任意一天，选标签、种类和时长，信息会直接落在格子里</p>' +
    panel +
  '</section>';
}

/* ---------- 工作复盘（带锁） ---------- */
var lockErr = {};
/* 前台和后台分开记解锁状态：后台解锁不会让前台跟着敞开；
   前台的解锁只在“待在这个板块里”时有效，一离开就重新锁上。 */
function unlockKey(id, where){ return 'eggUnlock:' + (where || 'view') + ':' + id; }
function isUnlocked(b, where){
  try{ return sessionStorage.getItem(unlockKey(b.id, where || 'view')) === '1'; }catch(e){ return false; }
}
function setUnlocked(id, where, on){
  try{
    if(on) sessionStorage.setItem(unlockKey(id, where), '1');
    else sessionStorage.removeItem(unlockKey(id, where));
  }catch(e){}
}
function clearViewUnlocks(){
  try{
    var drop = [];
    for(var i = 0; i < sessionStorage.length; i++){
      var k = sessionStorage.key(i);
      if(k && k.indexOf('eggUnlock:view:') === 0) drop.push(k);
    }
    drop.forEach(function(k){ sessionStorage.removeItem(k); });
  }catch(e){}
}
function lockInner(b, where){
  return '<div class="lock-egg">' + eggIcon('crack') + '</div>' +
    '<h2>这个板块锁着</h2>' +
    '<p class="lock-sub">' + (where === 'admin'
      ? '先解锁才能编辑「' + esc(b.title) + '」。'
      : '输入密码才能打开「' + esc(b.title) + '」。') + '</p>' +
    '<div class="lock-row">' +
      '<input type="password" data-enter="unlock-review" data-id="' + b.id + '" data-where="' + (where || 'view') + '" placeholder="密码" autocomplete="off" inputmode="numeric">' +
      '<button class="btn primary" data-act="unlock-review" data-id="' + b.id + '" data-where="' + (where || 'view') + '">解锁</button>' +
    '</div>' +
    (where === 'admin' ? '' : '<p class="lock-note">不是给你设的门槛，是给这块内容留的私密感。离开这个板块就会重新锁上。</p>') +
    (lockErr[b.id] ? '<p class="lock-err">' + esc(lockErr[b.id]) + '</p>' : '');
}
function lockCard(b, where){
  return '<section class="card lock-card">' + lockInner(b, where) + '</section>';
}

function reviewEntryHTML(e, dims){
  var period = '';
  if(e.start || e.end){
    period = (e.start ? fmtYM(e.start) : '?') + ' – ' + (e.end ? fmtYM(e.end) : '至今');
    if(e.start && e.end) period += ' · ' + monthsBetween(e.start, e.end) + ' 个月';
  }
  var kpis = e.metrics.length ? '<div class="rev-kpis">' + e.metrics.map(function(m){
    return '<span class="kpi"><b>' + (esc(m.value) || '—') + '</b>' +
      (m.unit ? '<i>' + esc(m.unit) + '</i>' : '') +
      '<em>' + (esc(m.name) || '指标') + '</em></span>';
  }).join('') + '</div>' : '';

  var bars = '<div class="rev-dims">' + dims.map(function(dim, i){
    var v = clampInt(e.scores[i], 0, 5, 0);
    return '<div class="dim"><span class="dim-name">' + esc(dim) + '</span>' +
      '<span class="dim-bar"><i style="width:' + (v / 5 * 100) + '%"></i></span>' +
      '<span class="dim-val">' + v + '</span></div>';
  }).join('') + '</div>';

  return '<article class="rev-item">' +
    '<div class="rev-head">' +
      '<span class="tag ' + (e.kind === '项目' ? 't2' : 't0') + '">' + e.kind + '</span>' +
      '<h3 class="rev-title">' + (esc(e.title) || '未命名经历') + '</h3>' +
      (e.status ? '<span class="rev-status">' + esc(e.status) + '</span>' : '') +
    '</div>' +
    '<p class="rev-meta">' +
      [e.org, e.role, period].filter(Boolean).map(esc).join(' · ') +
    '</p>' +
    (e.summary ? '<p class="rev-summary">' + esc(e.summary) + '</p>' : '') +
    kpis + bars +
    (e.doc ? '<details class="rev-doc"><summary>复盘文档</summary><div class="rev-body">' + esc(e.doc) + '</div></details>' : '') +
    (e.imgs && e.imgs.length ? '<div class="rev-imgs">' + e.imgs.map(function(src, ii){
      return '<span class="img-th" data-act="img-view" data-b="' + e._bid + '" data-path="data.entries.' + e._i + '.imgs" data-i="' + ii + '" ' +
        'role="button" tabindex="0" title="看大图"><img src="' + src + '" alt="配图" loading="lazy"></span>';
    }).join('') + '</div>' : '') +
  '</article>';
}

function viewReview(b){
  if(!isUnlocked(b, 'view')) return lockCard(b, 'view');
  var d = b.data;
  if(!d.entries.length){
    return '<section class="card">' + emptyBox('还没有复盘，去后台加一段经历', '#/admin', '去后台') + '</section>';
  }
  var totalMonths = d.entries.reduce(function(s, e){
    return s + (e.start ? monthsBetween(e.start, e.end || todayYmd()) : 0);
  }, 0);
  var latest = d.entries[0];

  var stats = '<div class="rev-stats">' +
    '<div class="rev-stat"><span>经历</span><b>' + d.entries.length + '</b><i>段</i></div>' +
    '<div class="rev-stat"><span>累计时长</span><b>' + totalMonths + '</b><i>个月</i></div>' +
    '<div class="rev-stat wide"><span>最近一段</span><b class="sm">' + (esc(latest.role) || esc(latest.title) || '—') + '</b></div>' +
  '</div>';

  return stats + '<div class="rev-timeline">' + d.entries.map(function(e, i){
    e._bid = b.id; e._i = i;

  }).join('') + '</div>';

/* =========================================================
   8. 路由与渲染
   ========================================================= */
function route(){
  var h = location.hash.replace(/^#\/?/, '');
  if(h.indexOf('b/') === 0) return { key:'block:' + h.slice(2), view:'block', id:h.slice(2) };
  if(h === 'admin') return { key:'admin', view:'admin' };
  return { key:'overview', view:'overview' };
}

function renderNav(r){
  var html = '<a class="nav-item nav-overview' + (r.key === 'overview' ? ' active' : '') + '" href="#/overview">' +
      icon('overview') + '<span class="nav-text">总览</span></a>';

  GROUPS.forEach(function(g){
    var trSeen = false;
    var items = state.blocks.filter(function(b){
      if(groupOfType(b.type) !== g.id) return false;
      /* 前台数值追踪合并成一个面板，导航只留第一个入口 */
      if(b.type === 'tracker'){ if(trSeen) return false; trSeen = true; }
      return true;
    });
    if(!items.length) return;
    var trCount = state.blocks.filter(function(b){ return b.type === 'tracker'; }).length;
    var open = isGroupOpen(g.id);
    var hasActive = items.some(function(b){ return r.key === 'block:' + b.id; });
    html += '<div class="nav-group' + (open ? '' : ' closed') + (hasActive ? ' has-active' : '') + '" data-g="' + g.id + '">' +
      '<button class="nav-ghead" data-act="nav-group" data-g="' + g.id + '" ' +
        'aria-expanded="' + (open ? 'true' : 'false') + '" title="' + esc(g.hint) + '">' +
        icon(g.id, 'ico-g') +
        '<span class="nav-gname">' + g.name + '</span>' +
        '<span class="nav-gcount">' + items.length + '</span>' +
        '<svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>' +
      '</button>' +
      '<div class="nav-gwrap"><div class="nav-gbody">' +
        items.map(function(b){
          var on = r.key === 'block:' + b.id;
          var navName = (b.type === 'tracker' && trCount > 1) ? '数值追踪' : (b.title || '未命名板块');
          return '<a class="nav-item' + (on ? ' active' : '') + '" href="#/b/' + b.id + '" data-nav="' + b.id + '">' +
            icon(b.type) + '<span class="nav-text">' + esc(navName) + '</span></a>';
        }).join('') +
      '</div></div>' +
    '</div>';
  });

  if(!state.blocks.length){
    html += '<p class="nav-empty small">还没有板块<br>去后台加一块</p>';
  }

  html += '<a class="nav-item nav-admin' + (r.key === 'admin' ? ' active' : '') + '" href="#/admin">' +
      icon('setting') + '<span class="nav-text">后台</span></a>';

  $('#nav').innerHTML = html;
}

var lastViewBlock = '';
function render(){
  var r = route();
  /* 离开前台板块页就丢掉前台的解锁状态：下次再看还得输密码 */
  var nowBlock = r.view === 'block' ? r.id : '';
  if(lastViewBlock && lastViewBlock !== nowBlock) clearViewUnlocks();
  lastViewBlock = nowBlock;

  $('#brandTitle').textContent = state.settings.title || 'egg 的个人工作台';
  document.title = state.settings.title || 'egg 的个人工作台';
  var bl = $('#buildLine');
  if(bl) bl.textContent = BUILD;
  renderNav(r);

  var v = $('#view');
  if(r.view === 'admin'){
    v.innerHTML = viewAdmin();
  }else if(r.view === 'block'){
    var b = blockById(r.id);
    v.innerHTML = b ? viewBlock(b)
      : '<section class="card">' + emptyBox('这个板块不见了，可能已经被删除。', '#/admin', '回后台') + '</section>';
  }else{
    v.innerHTML = viewOverview();
  }
}

function getPath(obj, path){
  var parts = path.split('.');
  var cur = obj;
  for(var i = 0; i < parts.length; i++){
    if(cur == null || typeof cur !== 'object') return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
function setPath(obj, path, val){
  var parts = path.split('.');
  var cur = obj;
  for(var i = 0; i < parts.length - 1; i++){
    var k = parts[i];
    if(cur[k] == null || typeof cur[k] !== 'object'){
      cur[k] = /^\d+$/.test(parts[i+1]) ? [] : {};
    }
    cur = cur[k];
  }
  cur[parts[parts.length - 1]] = val;
}

function applyField(el){
  var p = el.getAttribute('data-p');
  if(!p) return;
  var root = state;
  var bid = el.getAttribute('data-b');
  if(bid){
    root = blockById(bid);
    if(!root) return;
  }
  var v = el.value;
  if(el.getAttribute('data-arr')) v = v.split(/[,，、;；]/).map(function(s){ return s.trim(); }).filter(Boolean);
  else if(el.type === 'number' || el.type === 'range'){
    v = v === '' ? '' : Number(v);
    if(p.slice(-4) === '.pct' && v !== '') v = clampPct(v);
  }
  /* 下拉框等控件给的是字符串；如果字段本来就是数字，保持数字，
     否则严格比较（=== 列号、星期）会失配，看板会"丢卡"。 */
  else if(typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v)){
    var old0 = getPath(root, p);
    if(typeof old0 === 'number') v = Number(v);
  }

  setPath(root, p, v);
  scheduleSave();

  if(p === 'title' && bid){
    var navEl = document.querySelector('[data-nav="' + bid + '"] .nav-text');
    if(navEl) navEl.textContent = v || '未命名板块';
  }
}

function toggleTop3(i){
  var it = state.overview.top3[i];
  if(!it) return;
  it.done = !it.done;
  it.date = todayYmd();
  saveNow();
  render();
}

function toggleHabit(bid, hid, day){
  var b = blockById(bid);
  if(!b || day !== todayYmd()) return;
  if(!isObj(b.data.log)) b.data.log = {};
  if(!isObj(b.data.log[hid])) b.data.log[hid] = {};
  if(b.data.log[hid][day]) delete b.data.log[hid][day];
  else b.data.log[hid][day] = true;
  saveNow();
  render();
}

function newBlockData(type){
  var t = todayYmd();
  if(type === 'goal'){
    return { goal:'', dueDate: addDays(t, 30),
      progress:[{ id:uid('p'), name:'', pct:0, note:'' }], notes:[] };
  }
  if(type === 'agenda'){
    return { categories:['工作','生活','学习','健康'],
      items:[{ id:uid('a'), date:t, text:'', type:'工作' }] };
  }
  if(type === 'habit') return { habits:[{ id:uid('h'), name:'' }], log:{} };
  if(type === 'timetable'){
    return { periods:['第 1-2 节','第 3-4 节','第 5-6 节'], slots:[] };
  }
  if(type === 'kanban'){
    return { columns:['想法','在做','完成'],
      cards:[{ id:uid('k'), title:'', sub:'', col:0, date:'', note:'' }] };
  }
  if(type === 'ideas') return { notes:[] };
  if(type === 'reviews'){
    return { items:[{ id:uid('r'), kind:'电影', title:'', stars:0, review:'', quotes:'' }] };
  }
  if(type === 'ledger'){
    return { budget:3000, categories:['吃饭','交通','购物','其他'], entries:[] };
  }
  if(type === 'tracker'){
    return { label:'睡眠', unit:'小时', target:8, lowAt:6, records:{} };
  }
  if(type === 'people'){
    return { staleDays:30, list:[{ id:uid('c'), name:'', relation:'', last:t, birthday:'', note:'' }] };
  }
  if(type === 'gym'){
    return { tags:[
      { id:uid('g'), label:'力量', color:'#C98A4B' },
      { id:uid('g'), label:'有氧', color:'#9DB08F' },
      { id:uid('g'), label:'拉伸', color:'#EFC463' }
    ], kinds:{ aerobic:GYM_KINDS_DEFAULT.aerobic.slice(), strength:GYM_KINDS_DEFAULT.strength.slice() }, days:{} };
  }
  if(type === 'vocab'){
    return { lang:'en', seq:0, known:{ en:{}, es:{} } };
  }
  if(type === 'review'){
    return { password:'737504',
      dims:['业务判断','协作沟通','推进落地','复盘能力','抗压'],
      entries:[] };
  }
  return { habits:[{ id:uid('h'), name:'' }], log:{} };
}

function addBlockOfType(type){
  if(TYPE_ORDER.indexOf(type) < 0) type = 'goal';
  var b = { id:uid('b'), type:type, title:typeName(type), data:newBlockData(type) };
  state.blocks.push(b);
  saveNow();
  render();
  var forms = document.querySelectorAll('.block-form');
  var lastForm = forms && forms.length ? forms[forms.length - 1] : null;
  if(lastForm && lastForm.scrollIntoView) lastForm.scrollIntoView({ block:'start', behavior:'smooth' });
  toast('已添加「' + typeName(type) + '」，顺着往下滚填内容');
}

  /* ----- 日程批量粘贴 ----- */
  'agenda-paste': function(el){
    var b = blockById(el.getAttribute('data-id'));
    if(!b) return;
    var box = document.querySelector('#pasteBox_' + b.id);
    if(!box) return;
    var lines = String(box.value || '').split(/\n/);
    var added = 0, skipped = 0;
    var y = todayYmd().slice(0, 4);
    lines.forEach(function(line){
      line = line.trim();
      if(!line) return;
      var parts = line.split(/[、,，]/).map(function(x){ return x.trim(); }).filter(Boolean);
      if(parts.length < 2){ skipped++; return; }
      /* 日期支持 2026-11-20 / 11-20 / 11/20，缺年份补今年 */
      var ds = '';
      var mFull = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(parts[0]);
      var mShort = /^(\d{1,2})[-/.](\d{1,2})$/.exec(parts[0]);
      if(mFull) ds = mFull[1] + '-' + pad(Number(mFull[2])) + '-' + pad(Number(mFull[3]));
      else if(mShort) ds = y + '-' + pad(Number(mShort[1])) + '-' + pad(Number(mShort[2]));
      if(!isDateStr(ds)){ skipped++; return; }
      var type = parts[2] || '生活';
      if(b.data.categories.indexOf(type) < 0){ b.data.categories.push(type); }
      b.data.items.push({ id:uid('a'), date:ds, text:parts[1], type:type });
      added++;
    });
    if(added){
      saveNow(); render();
      toast('加进去了 ' + added + ' 条' + (skipped ? '，' + skipped + ' 行没认出来' : ''));
      var nb = document.querySelector('#pasteBox_' + b.id);
      if(nb) nb.focus();
    }else{
      toast('没有能认出来的行，检查一下格式「日期、事情、类型」');
    }
  },

function moveBlock(id, dir){
  var i = state.blocks.findIndex(function(b){ return b.id === id; });
  if(i < 0) return;
  var j = i + dir;
  if(j < 0 || j >= state.blocks.length) return;
  var tmp = state.blocks[i];
  state.blocks[i] = state.blocks[j];
  state.blocks[j] = tmp;
  saveNow();
  render();
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.tagName === 'SELECT') return;   /* 下拉交给 change 处理 */
  var act = el.getAttribute('data-act');
  var fn = ACTIONS[act];
  if(!fn) return;
  e.preventDefault();
  fn(el);
});

document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.shiftKey) return;
  var el = e.target;
  if(!el || !el.getAttribute || !el.getAttribute('data-enter')) return;
  if(el.tagName === 'TEXTAREA') return;
  e.preventDefault();
  var fn = ACTIONS[el.getAttribute('data-enter')];
  if(fn) fn(el);
});

document.addEventListener('input', function(e){
  var el = e.target;
  if(!el || !el.getAttribute || !el.getAttribute('data-p')) return;
  if(el.getAttribute('data-arr')) return;
  if(el.type === 'date') return;
  if(el.tagName === 'SELECT') return;
  applyField(el);
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(!el || !el.getAttribute) return;
  var act = el.getAttribute('data-act');
  if(act && ACTIONS[act]){ ACTIONS[act](el); return; }
  if(!el.getAttribute('data-p')) return;
  applyField(el);
  if(el.getAttribute('data-arr') || el.getAttribute('data-refresh')) render();
});

/* =========================================================
   10. 备份 / 恢复 / 清空
   ========================================================= */
/* 把当前数据写进一份新网页：换浏览器 / 换设备打开它就能带回来 */
function dataHTML(){
  var doc = document.documentElement.cloneNode(true);
  var v = doc.querySelector('#view'); if(v) v.innerHTML = '';
  var nv = doc.querySelector('#nav'); if(nv) nv.innerHTML = '';
  Array.prototype.forEach.call(doc.querySelectorAll('.modal-backdrop'), function(x){
    if(x && x.parentNode) x.parentNode.removeChild(x);
  });
  var seed = doc.querySelector('#eggSeed');
  if(seed){
    /* 转义 < 防止数据里的文本提前闭合脚本标签 */
    seed.textContent = JSON.stringify(state).replace(/</g, '\\u003c');
  }
  return '<!DOCTYPE html>' + String.fromCharCode(10) + doc.outerHTML;
}

function exportDataHTML(){
  state.meta = isObj(state.meta) ? state.meta : {};
  state.meta.lastExportAt = new Date().toISOString();
  saveNow();
  var html = dataHTML();
  var name = 'egg的个人工作台-' + todayYmd().replace(/-/g, '') + '.html';

  function dl(){
    var blob = new Blob([html], { type:'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast('带数据的网页已下载，换设备打开它就能带回来');
    render();
  }

  if(!window.showSaveFilePicker){ dl(); return; }
  window.showSaveFilePicker({
    suggestedName: name,
    types: [{ description:'网页文件', accept: { 'text/html': ['.html'] } }]
  }).then(function(h){
    return h.createWritable().then(function(w){
      return w.write(new Blob([html], { type:'text/html;charset=utf-8' })).then(function(){ return w.close(); });
    }).then(function(){
      try{ exportName = h.name || name; }catch(e){}
      toast('已存成「' + (exportName || name) + '」，换浏览器 / 换设备打开它就能带回来');
      render();
    });
  }).catch(function(){ /* 用户取消 */ });
}
var exportName = '';

function backup(){
  var text = JSON.stringify(state, null, 2);
  var blob = new Blob([text], { type:'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'egg-workbench-' + todayYmd().replace(/-/g, '') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  toast('备份已下载，收好这个文件');
}

function snapshot(){
  try{
    var key = DB_KEY + '.snapshot.' + Date.now();
    localStorage.setItem(key, JSON.stringify(state));
    var keys = [];
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(DB_KEY + '.snapshot.') === 0) keys.push(k);
    }
    keys.sort();
    while(keys.length > 3){ localStorage.removeItem(keys.shift()); }
  }catch(e){}
}

function askRestore(text, name){
  var parsed;
  try{ parsed = JSON.parse(text); }catch(err){ toast('这个文件不是有效的备份'); return; }
  if(!parsed || !Array.isArray(parsed.blocks)){ toast('备份文件里没有板块数据'); return; }
  var next = migrate(parsed);
  var when = '';
  try{ when = new Date(parsed.updatedAt).toLocaleString('zh-CN'); }catch(e){}
  modal({
    title:'用这份备份覆盖现在的内容？',
    body:'<div class="kv"><span>文件</span><b>' + esc(name || '备份文件') + '</b></div>' +
      '<div class="kv"><span>备份时间</span><b>' + esc(when || '未记录') + '</b></div>' +
      '<div class="kv"><span>板块</span><b>' + next.blocks.length + ' 个</b></div>' +
      '<div class="kv"><span>数据版本</span><b>v' + next.schemaVersion + '</b></div>' +
      '<p style="margin-top:12px" class="small muted">当前内容会先存一份回滚点，再被覆盖。</p>',
    actions:[
      { label:'取消' },
      { label:'确认恢复', cls:'primary', onClick:function(){
          snapshot();
          state = next;
          saveNow();
          render();
          location.hash = '#/overview';
          toast('已恢复 ' + next.blocks.length + ' 个板块');
        } }
    ]
  });
}

function askClear(){
  var m = modal({
    title:'清空所有数据？',
    body:'<p>板块、文字、日期、打卡记录、三件事，全部会删掉。</p>' +
      '<p style="margin-top:8px">清空前会自动存一份回滚点，但真正想留住内容请先下载备份。</p>' +
      '<p style="margin-top:14px" class="small">输入密码确认：</p>' +
      '<input id="clearWord" type="password" placeholder="密码" autocomplete="off" style="margin-top:6px">',
    actions:[
      { label:'取消' },
      { label:'确认清空', cls:'danger', disabled:true, onClick:function(){
          snapshot();
          state = blankState();
          saveNow();
          render();
          location.hash = '#/overview';
          toast('已清空，从头开始');
        } }
    ]
  });
  var input = m.mask.querySelector('#clearWord');
  var btns = m.mask.querySelectorAll('.modal-actions .btn');
  var ok = btns[btns.length - 1];
  if(input){
    input.addEventListener('input', function(){
      ok.disabled = input.value.trim() !== '737504';
    });
    setTimeout(function(){ input.focus(); }, 40);
  }
}

$('#imgInput').addEventListener('change', function(e){
  var files = (e.target.files || []).slice(0, 6);
  e.target.value = '';
  if(!files.length || !imgTarget) return;
  var bid = imgTarget.bid, path = imgTarget.path;
  var arr = imgArrRef(bid, path);
  if(!arr){ toast('这条记录不在了'); return; }
  var done = 0, added = 0;
  files.forEach(function(f){
    imgFromFile(f, function(dataUrl){
      done++;
      if(dataUrl && arr.length < 24){ arr.push(dataUrl); added++; }
      if(done === files.length){
        if(added){
          saveNow();
          render();
          toast('加了 ' + added + ' 张图' + (arr.length >= 24 ? '（一条最多 24 张）' : ''));
        }else{
          toast('这些图片读不出来');
        }
      }
    });
  });
});

$('#restoreInput').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    askRestore(String(reader.result || ''), f.name);
    e.target.value = '';
  };
  reader.onerror = function(){ toast('读不了这个文件'); e.target.value = ''; };
  reader.readAsText(f);
});

/* =========================================================
   11. 弹窗 / 提示
   ========================================================= */
function modal(opt){
  var mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3 class="modal-title">' + esc(opt.title) + '</h3>' +
      '<div class="modal-body">' + opt.body + '</div>' +
      '<div class="modal-actions"></div>' +
    '</div>';
  var bar = mask.querySelector('.modal-actions');
  var api = { mask:mask, close:close };

  (opt.actions || []).forEach(function(a){
    var btn = document.createElement('button');
    btn.className = 'btn ' + (a.cls || '');
    btn.textContent = a.label;
    if(a.disabled) btn.disabled = true;
    btn.addEventListener('click', function(){
      if(a.onClick){ if(a.onClick(mask) === false) return; }
      close();
    });
    bar.appendChild(btn);
  });

  function close(){
    mask.remove();
    document.removeEventListener('keydown', onKey);
  }
  function onKey(ev){ if(ev.key === 'Escape') close(); }

  mask.addEventListener('click', function(ev){ if(ev.target === mask) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(mask);
  return api;
}

var toastTimer = null;
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

  boot();

  $('#brandEgg').innerHTML = eggIcon('whole');

  render();
  syncDay();
  setSaveTag('saved');

  window.addEventListener('hashchange', function(){
    render();
    window.scrollTo(0, 0);
  });

  window.addEventListener('pagehide', function(){ if(dirty) saveNow(); });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ if(dirty) saveNow(); }
    else tickDay();
  });
  setInterval(tickDay, 60000);

  if(bootWarn) setTimeout(function(){ toast(bootWarn); }, 600);
}

init();
})();
