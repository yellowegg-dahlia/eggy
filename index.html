<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFAF3">
<title>egg 的个人工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --shell:#FDFAF3;--paper:#FFFFFF;--paper-warm:#FFFDF6;
  --cream:#F9EFDA;--cream-2:#F3E6CC;
  --yolk:#EFC463;--yolk-deep:#DFAE3F;--yolk-soft:#F8E3AE;
  --caramel:#C98A4B;--moss:#9DB08F;
  --ink:#2B2724;--ink-2:#6B6459;--ink-3:#9C9284;
  --line:#EDE3D1;--line-2:#E2D6BF;
  --r-lg:22px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(43,39,36,.04),0 14px 34px -24px rgba(43,39,36,.5);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--shell);color:var(--ink);font-size:15px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,figure{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::selection{background:#F7E0A8}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* ---------- 蛋 ---------- */
.egg{display:block;width:100%;height:auto;color:#5B5347;overflow:visible}
.egg .body{fill:#FFFDF8}
.egg .line{fill:none}
.egg circle{fill:var(--yolk);stroke:none}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px 18px;background:#FBF3E3;
  border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.brand-egg{width:24px;flex:0 0 auto;color:#8C7A55}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.3}
.brand p{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.nav-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;padding-bottom:4px}
.ico{width:17px;height:17px;flex:0 0 auto;color:#B29C72}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:11px;
  color:var(--ink-2);font-size:13.5px;border:1px solid transparent;transition:.16s ease;min-width:0}
.nav-item .ico{width:16px;height:16px}
.nav-item:hover{background:#F6EBD4;color:var(--ink)}
.nav-item.active{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:500;
  box-shadow:0 1px 2px rgba(43,39,36,.05)}
.nav-item.active .ico{color:var(--caramel)}
.nav-overview{margin-bottom:4px}
.nav-admin{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line-2);border-radius:0;color:var(--ink-3);font-size:13px}
.nav-group{margin-top:2px}
.nav-ghead{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;border-radius:10px;
  color:#94805B;font-size:11.5px;letter-spacing:.1em;font-weight:600;transition:background .16s ease;min-width:0}
.nav-ghead:hover{background:#F6EBD4;color:#7A6845}
.nav-ghead .ico-g{width:15px;height:15px;color:#B29C72}
.nav-group.has-active .nav-ghead{color:#8A6A2E}
.nav-gname{flex:1;text-align:left;white-space:nowrap}
.nav-gcount{font-size:10.5px;color:#BAAE96;font-weight:400;font-variant-numeric:tabular-nums;flex:0 0 auto}
.nav-arrow{width:13px;height:13px;color:#BAAE96;transition:transform .24s cubic-bezier(.4,0,.2,1);flex:0 0 auto}
.nav-group.closed .nav-arrow{transform:rotate(-90deg)}
.nav-gwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1)}
.nav-group.closed .nav-gwrap{grid-template-rows:0fr}
.nav-gbody{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:1px;
  margin-left:13px;padding-left:6px;border-left:1px solid #EFE2C8}
.nav-group .nav-item{padding:7px 10px;font-size:13px}
.nav-empty{padding:10px 12px;color:var(--ink-3);line-height:1.6}
.nav-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px dashed var(--line-2);font-size:11.5px;color:var(--ink-3)}
.side-foot p{margin:0;line-height:1.7}
.build-line{margin-top:6px !important;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);opacity:.8}
.save-line{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--ink-2)}
.save-line i{width:6px;height:6px;border-radius:50%;background:var(--moss);flex:0 0 auto}
.save-line.saving i{background:var(--yolk-deep)}
.save-line.error i{background:#B4685C}

.main{padding:30px 38px 70px;max-width:1120px;width:100%}
.view{max-width:860px}

/* ---------- 通用组件 ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.card-head h2{font-size:15px;font-weight:600;letter-spacing:.01em}
.hint{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:8px;text-transform:uppercase}
.page-title{font-size:27px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.page-sub{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.head-egg{width:64px;flex:0 0 auto;color:#8C7A55;position:relative;margin-bottom:2px}
.egg-halo{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:92%;height:76%;
  border-radius:50%;background:#F6DFAC;opacity:.85}
.head-egg .egg{position:relative}

/* ---------- 总览 ---------- */
.top3-card{background:linear-gradient(180deg,#FFFCF2 0%,#FFFFFF 62%);padding-bottom:14px}
.top3{display:flex;flex-direction:column}
.top3-item{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px dashed #F0E7D6}
.top3-item:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid #DCCFB6;flex:0 0 auto;
  position:relative;background:#fff;transition:.18s ease}
.check:hover{border-color:var(--yolk-deep);background:#FFFBF0}
.check.on{background:var(--yolk);border-color:var(--yolk-deep)}
.check.on::after{content:"";position:absolute;left:8px;top:5px;width:7px;height:12px;
  border-right:2px solid #2B2724;border-bottom:2px solid #2B2724;transform:rotate(42deg)}
.top3-text{font-size:16.5px;font-weight:500;letter-spacing:-.005em;line-height:1.45}
.top3-item.done .top3-text{color:var(--ink-3);text-decoration:line-through;
  text-decoration-color:#CFC2A8;text-decoration-thickness:1.5px}
.top3-text a{border-bottom:1px solid var(--line-2)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.grid3 .card{margin-bottom:0;padding:20px}
.mini{display:flex;flex-direction:column}
.mini-label{font-size:11.5px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.num-row{display:flex;align-items:baseline;gap:6px}
.big-num{font-size:42px;line-height:1;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--ink-2)}
.mini-sub{margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.mini-goal{margin-top:12px;font-size:14px;font-weight:500;line-height:1.5}
.mini-meta{margin-top:4px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mini-link{margin-top:auto;padding-top:14px;font-size:12.5px;color:var(--caramel);display:inline-block}
.mini-link:hover{color:var(--ink)}
.mini-list{display:flex;flex-direction:column;gap:11px;margin-top:2px}
.mini-list li{display:flex;gap:9px;align-items:baseline;font-size:13px;line-height:1.45}
.d-chip{flex:0 0 auto;font-size:11px;color:#8A7A5F;background:#FBF3E1;border-radius:6px;
  padding:2px 6px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.a-text{min-width:0}
.dots{display:flex;gap:4px;margin:16px 0 4px}
.dots i{flex:1;height:8px;border-radius:3px;background:#F2E8D5}
.dots i.on{background:var(--yolk)}
.dots i.now{outline:1.5px dashed #C9B58C;outline-offset:2px}

/* ---------- 空状态 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 12px;
  color:var(--ink-3);text-align:center;font-size:12.5px;line-height:1.6}
.empty .egg{width:36px;color:#C9B58C}
.empty.small{padding:14px 4px;gap:6px}
.empty.small .egg{width:26px}
.empty p{max-width:280px}

/* ---------- 目标冲刺 ---------- */
.goal-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;
  background:linear-gradient(120deg,#FFFCF2,#FFF9EC);padding:26px 28px}
.goal-hero .big-num{font-size:54px}
.goal-egg{width:76px;flex:0 0 auto;color:#8C7A55}
.progress-list{display:flex;flex-direction:column;gap:20px;margin-top:14px}
.p-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px}
.p-name{font-size:14px;font-weight:500}
.p-pct{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:#F4EBD8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--yolk);transition:width .4s ease}
.bar i.full{background:var(--moss)}
.p-note{margin-top:7px;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.notes{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.notes li{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed #F0E7D6}
.notes li:last-child{border-bottom:0}
.note-date{flex:0 0 52px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.note-text{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}

/* ---------- 日程 ---------- */
.ag-group{margin-top:18px}
.ag-group:first-of-type{margin-top:10px}
.ag-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ag-date{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ag-wd{font-size:11.5px;color:var(--ink-3)}
.rel-tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--yolk-soft);color:#7A5B1E}
.ag-list{display:flex;flex-direction:column;gap:2px}
.ag-list li{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px dashed #F3EADA;font-size:14px}
.ag-list li:last-child{border-bottom:0}
.ag-list.today li{border-bottom-color:#EFE0C2}
.tag{flex:0 0 auto;font-size:11px;line-height:18px;padding:0 8px;border-radius:999px;
  background:#F1EDE4;color:#6B6459;white-space:nowrap}
.tag.t0{background:#FBF0D6;color:#8A6A2E}
.tag.t1{background:#EAF0E2;color:#5F7050}
.tag.t2{background:#F3E7DC;color:#8A5F3C}
.tag.t3{background:#F6E9E3;color:#8E5F52}
.tag.t4{background:#EEF0E6;color:#6A7256}
.tag.t5{background:#F5EFE1;color:#7B6C4F}
.past-card{padding:0;overflow:hidden}
.past-card>summary{list-style:none;cursor:pointer;padding:16px 24px;font-size:13px;color:var(--ink-3);
  display:flex;align-items:center;gap:8px}
.past-card>summary::-webkit-details-marker{display:none}
.past-card>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--ink-3);
  border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);margin-right:4px;transition:.2s}
.past-card[open]>summary::before{transform:rotate(45deg)}
.past-body{padding:0 24px 20px;opacity:.62}

/* ---------- 打卡 ---------- */
.habit-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px -4px 0;padding:0 4px 6px}
.hg{display:grid;gap:5px;min-width:420px;align-items:center}
.hg-day{font-size:10.5px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums;padding-bottom:2px}
.hg-day.now{color:var(--ink);font-weight:600}
.hg-name{font-size:12.5px;color:var(--ink-2);padding-right:6px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cell{width:100%;aspect-ratio:1/1;min-height:20px;border-radius:6px;background:#F6EEDD;
  border:1px solid transparent;transition:.15s ease;padding:0}
.cell.on{background:var(--yolk);border-color:var(--yolk-deep)}
.cell.now{border:1.5px dashed #C9B58C;background:#FBF2DC}
.cell.now.on{border-style:solid;background:var(--yolk)}
.cell:not([disabled]):hover{transform:translateY(-1px)}
.cell[disabled]{cursor:default}
.habit-foot{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;padding-top:14px;
  border-top:1px dashed var(--line-2)}
.hf{font-size:12.5px;color:var(--ink-3)}
.hf b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;padding:0 2px}

/* ---------- 后台 ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid.one{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--paper-warm);outline:none;transition:.15s ease;font-size:14px}
input:hover,select:hover,textarea:hover{border-color:#D8C9AC}
input:focus,select:focus,textarea:focus{border-color:var(--yolk-deep);background:#fff;
  box-shadow:0 0 0 3px rgba(239,196,99,.22)}
textarea{resize:vertical;min-height:62px;line-height:1.55}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;
  border-radius:11px;border:1px solid var(--line-2);background:var(--paper);font-size:13.5px;
  transition:.16s ease;white-space:nowrap}
.btn:hover{border-color:#D8C9AC;background:var(--paper-warm)}
.btn.primary{background:var(--yolk);border-color:var(--yolk-deep);color:#33280F}
.btn.primary:hover{background:#EAB94F}
.btn.danger{color:#A5544A;border-color:#E8CFC6;background:#FFFCFA}
.btn.danger:hover{background:#FBF0EC;border-color:#DDB4A7}
.btn.small{padding:5px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--paper);border-color:var(--line-2)}
.icon-btn{width:28px;height:28px;border-radius:8px;color:var(--ink-3);display:grid;place-items:center;
  font-size:15px;line-height:1;transition:.15s}
.icon-btn:hover{background:#F7EFDD;color:#A5544A}
.icon-btn:disabled{opacity:.25;cursor:not-allowed}
.icon-btn:disabled:hover{background:transparent;color:var(--ink-3)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:30px 0 14px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:600}
.count{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:4px}
.add-row{display:flex;gap:8px;align-items:center}
.add-row select{width:auto;min-width:118px;padding:8px 10px;font-size:13px}
/* 积木速览：一眼看全 12 种，点一下就加 */
.quick-add{margin:0 0 4px}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:4px}
.qa-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;cursor:pointer;
  background:var(--shell);border:1px solid var(--line);color:var(--ink);font:inherit;
  transition:background .18s ease,border-color .18s ease,transform .18s ease;text-align:left}
.qa-chip:hover{background:var(--cream);border-color:var(--line-3);transform:translateY(-1px)}
.qa-chip:active{transform:translateY(0)}
.qa-chip:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
.qa-chip svg{width:22px;height:22px;flex:0 0 auto;color:#8C7A55}
.qa-chip b{font-size:12.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.block-form{margin-bottom:14px}
.bf-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px dashed var(--line-2)}
.bf-icon{width:26px;flex:0 0 auto;color:#8C7A55}
.bf-title-wrap{flex:1 1 auto;min-width:0}
.bf-title{font-size:16px;font-weight:600;border:1px solid transparent;background:transparent;
  padding:4px 8px;border-radius:8px;letter-spacing:-.005em}
.bf-title:hover{border-color:var(--line);background:var(--paper-warm)}
.bf-type{display:block;font-size:11px;color:var(--ink-3);padding-left:8px;letter-spacing:.06em}
.bf-tools{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:22px 0 10px;padding-top:16px;border-top:1px dashed #F1E8D7}
.sub-head h3{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.rows{display:flex;flex-direction:column;gap:8px}
.row3{display:grid;grid-template-columns:1.1fr 74px 1.5fr 28px;gap:8px;align-items:center}
.row3 input{padding:8px 10px;font-size:13.5px}
.row-note{display:grid;grid-template-columns:132px minmax(0,1fr) 28px;gap:8px;align-items:start}
.row-note textarea{min-height:44px;padding:8px 10px;font-size:13.5px}
.row-ag{display:grid;grid-template-columns:132px minmax(0,1fr) 96px 28px;gap:8px;align-items:center}
.row-ag input{font-size:13.5px;padding:8px 10px}
.row-habit{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:8px;align-items:center;max-width:340px}
.data-note{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:6px 0 16px;max-width:640px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.meta-line{margin-top:16px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- 弹窗 / 提示 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(43,39,36,.34);display:grid;place-items:center;
  padding:20px;z-index:100;animation:fade .18s ease}
.modal{background:#FFFDF8;border-radius:20px;width:100%;max-width:430px;padding:24px 26px 20px;
  box-shadow:0 30px 70px -24px rgba(43,39,36,.45);animation:pop .2s ease}
.modal-title{font-size:16px;font-weight:600;margin-bottom:10px}
.modal-body{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.modal-body .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.modal-body .kv:last-child{border-bottom:0}
.modal-body b{color:var(--ink);font-weight:600}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal-form{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.modal-form label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.modal-form input,.modal-form textarea{font-size:13.5px;color:var(--ink)}
.modal-form textarea{resize:vertical;line-height:1.6}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#2B2724;
  color:#FDFAF3;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;
  pointer-events:none;transition:.24s ease;z-index:120;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- 课表 ---------- */
.tt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}
.tt{min-width:580px}
.tt-row{display:grid;grid-template-columns:76px repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px}
.tt-head .tt-day{font-size:11.5px;color:var(--ink-3);text-align:center;padding:4px 0;border-radius:8px}
.tt-head .tt-day.now{background:var(--yolk);color:#3A2E12;font-weight:600}
.tt-period{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;padding-left:4px;line-height:1.35}
.tt-cell{min-height:56px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--paper-warm)}
.tt-cell.now{background:#FBF2DC;border-color:#EBDBB8}
.tt-course{font-size:12.5px;font-weight:500;line-height:1.35;word-break:break-word}
.tt-place{font-size:10.5px;color:var(--ink-3)}
.tt-empty{color:#DED3BC;font-size:12px;text-align:center}

/* ---------- 看板 ---------- */
.kb{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 8px}
.kb-col{flex:1 1 0;min-width:184px;background:#FBF7EC;border-radius:14px;padding:10px;border:1px solid #F2E9D7}
.kb-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:2px 4px 9px}
.kb-head .count{font-size:11px;color:var(--ink-3);font-weight:400}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.kb-title{font-size:13px;font-weight:500;line-height:1.4}
.kb-sub{font-size:11.5px;color:var(--ink-3)}
.kb-note{font-size:11.5px;color:var(--ink-2);line-height:1.5;border-top:1px dashed var(--line);padding-top:5px;margin-top:2px;width:100%}
.kb-empty{font-size:11px;color:#C4B79E;text-align:center;padding:14px 0;border:1px dashed #E8DCC4;border-radius:10px}

/* ---------- 灵感 ---------- */
.idea-input{display:flex;gap:8px;margin:8px 0 4px}
.idea-input input{flex:1 1 auto}
.idea-list{margin-top:6px}
.idea-list li{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed #F0E7D6;align-items:baseline}
.idea-list li:last-child{border-bottom:0}
.idea-text{font-size:14.5px;line-height:1.6;word-break:break-word}

/* ---------- 影评 & 书评 ---------- */
.rv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.rv-card{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--paper-warm);display:flex;flex-direction:column;gap:7px}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stars{letter-spacing:1px;font-size:13px;line-height:1;white-space:nowrap}
.star{color:#E3D9C6}
.star.on{color:var(--yolk-deep)}
.rv-title{font-size:14.5px;font-weight:600;line-height:1.4}
.rv-text{font-size:12.5px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap}
.rv-quote{margin:0;padding:9px 11px;border-left:2px solid var(--yolk);background:#FCF6E7;border-radius:0 8px 8px 0;font-size:12px;color:#7C6A48;line-height:1.6;white-space:pre-wrap}

/* ---------- 记账 ---------- */
.led-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 18px}
.led-kpi{background:var(--paper-warm);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.led-kpi span{font-size:11px;color:var(--ink-3);line-height:1.4}
.led-kpi b{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.led-kpi b.neg{color:#B4564A}
.led-cats{display:flex;flex-direction:column;gap:10px}
.led-cat-row{display:grid;grid-template-columns:64px minmax(0,1fr) 76px;gap:10px;align-items:center}
.led-cat-name{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-cat-bar{height:8px;background:#F4EBD8;border-radius:99px;overflow:hidden}
.led-cat-bar i{display:block;height:100%;background:var(--caramel);border-radius:99px}
.led-cat-val{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.led-list li{display:flex;align-items:baseline;gap:9px;padding:9px 2px;border-bottom:1px dashed #F3EADA;font-size:13px}
.led-list li:last-child{border-bottom:0}
.led-amt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
.led-add{display:grid;grid-template-columns:1.4fr 100px 96px 84px;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2)}
.led-add input,.led-add select{font-size:13px;padding:8px 10px}

/* ---------- 数值追踪 ---------- */
.tr-wrap{margin:16px 0 4px}
.tr-plot{position:relative;height:150px;padding:0 2px}
.tr-cols{display:flex;gap:8px;height:100%;align-items:flex-end}
.tr-col{flex:1 1 0;height:100%;display:flex;align-items:flex-end}
.tr-bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--yolk);position:relative;transition:height .3s}
.tr-bar.low{background:#D08472}
.tr-val{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tr-line{position:absolute;left:0;right:0;border-top:1.5px dashed #C9B58C;z-index:2}
.tr-line span{position:absolute;right:0;top:-16px;font-size:10.5px;color:#8A7A5F;background:var(--paper);padding:0 5px}
.tr-axis{display:flex;gap:8px;margin-top:6px}
.tr-axis span{flex:1 1 0;text-align:center;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tr-axis span.now{color:var(--ink);font-weight:600}
.tr-today{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2)}
.tr-today-label{font-size:12.5px;color:var(--ink-3)}
.tr-today input{width:92px;text-align:center}
.tr-unit{font-size:12px;color:var(--ink-3)}
.tr-edit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tr-day{display:flex;flex-direction:column;gap:3px}
.tr-day span{font-size:11px;color:var(--ink-3);text-align:center}
.tr-day input{padding:6px 4px;text-align:center;font-size:13px}

/* ---------- 人物树 ---------- */
/* 以蛋为中心的人物树 */
.pp-head-right{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;justify-content:flex-end;min-width:0;flex:1}
.pp-head-right .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.pp-head-right .btn{flex:0 0 auto}
.pp-tree{position:relative;width:100%;aspect-ratio:16/10;min-height:330px;margin:10px 0 6px}
.pp-links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pp-link{fill:none;stroke:#E6D6B7;stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linecap:round;
  animation:fadeIn .6s ease both}
.pp-link.over{stroke:#E7C3B6}
.pp-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2}
.pp-center-egg{display:block;width:54px;color:#8C7A55}
.pp-center-egg .egg{animation:breath 5.5s ease-in-out infinite}
.pp-center-label{font-size:11px;color:var(--ink-3);letter-spacing:.1em}
.pp-center.solo{position:static;transform:none;margin:8px auto 0}
.pp-node{position:absolute;transform:translate(-50%,-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:1px;width:108px;padding:8px 9px 7px;
  border-radius:13px;background:var(--paper);border:1px solid var(--line);text-align:center;
  box-shadow:0 1px 2px rgba(43,39,36,.05);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  animation:pop .34s cubic-bezier(.2,.8,.3,1) both}
.pp-node:hover{transform:translate(-50%,-50%) scale(1.07);border-color:#E2CFAB;z-index:6;
  box-shadow:0 12px 26px -18px rgba(43,39,36,.6)}
.pp-node.over{background:#FFF8F5;border-color:#EFD5CB}
.pp-node-name{font-size:12.5px;font-weight:600;line-height:1.35;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-node-rel{font-size:9.5px;color:#8A6A2E;background:#FBF0D6;border-radius:999px;padding:0 6px;line-height:1.6}
.pp-node-meta{font-size:9.5px;color:var(--ink-3)}
.pp-node.over .pp-node-meta{color:#B4564A;font-weight:500}
.pp-node-bd{font-size:9px;color:#B7A98E}
.pp-tree-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 18px;text-align:center}
.pp-list-m{display:none;flex-direction:column;gap:10px;margin-top:10px}
.pp-legend{margin-top:4px}
.pp-detail{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pp-d-meta{font-size:12.5px;color:var(--ink-2)}
.pp-d-note{font-size:13px;color:var(--ink);background:var(--cream);border-radius:10px;padding:9px 11px;line-height:1.6}
.pp-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pp-card{display:flex;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--paper-warm)}
.pp-card.over{border-color:#EAD3CA;background:#FFFBF8}
.pp-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-meta{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.pp-card.over .pp-meta{color:#A9705F}
.pp-note{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.pp-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;flex:0 0 auto}
.pp-warn{font-size:11px;color:#B4564A;background:#FBEBE6;border-radius:999px;padding:2px 8px;white-space:nowrap}

/* ---------- 健身 ---------- */
.gym-nav{display:flex;align-items:center;gap:6px;margin:6px 0 12px}
.gym-ym{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.gym-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.gym-week span{text-align:center;font-size:10.5px;color:var(--ink-3)}
.gym-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.gym-cell{position:relative;aspect-ratio:1/1;border-radius:10px;border:1px solid #F0E6D3;background:var(--paper-warm);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding:5px 4px 4px;
  overflow:hidden;text-align:center;color:var(--ink-2);
  transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease}
.gym-cell.blank{border:0;background:transparent;aspect-ratio:1/1}
.gym-cell.today{border:1.5px dashed #C9B58C;background:#FBF2DC}
.gym-cell.on{background:#F7E7C4;border-color:#E6CD9B}
.gym-cell.editing{border-color:var(--caramel);box-shadow:0 0 0 2px rgba(201,138,75,.2)}
.gym-cell:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 4px 12px -6px rgba(43,39,36,.45)}
.gym-cell:not([disabled]):active{transform:scale(.96)}
.gym-cell[disabled]{opacity:.55}
.gym-num{font-size:11px;color:var(--ink-3);line-height:1}
.gym-cell.on .gym-num,.gym-cell.editing .gym-num{color:#8A6A2E;font-weight:600}
.dumbbell{width:17px;height:10px;color:var(--caramel);margin-top:1px}
.gym-mark{display:flex;align-items:center;gap:3px;color:#8A6A2E;margin-top:2px}
.gym-mark .dumbbell{margin:0}
.gym-mark i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:-.02em}
.gym-kinds{font-size:8.8px;line-height:1.2;color:#8A6A2E;margin-top:1px;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.gym-hint{margin-top:10px}
/* 点开的训练面板 */
.gym-panel{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--paper-warm);
  padding:13px 15px 12px;animation:rise .26s cubic-bezier(.2,.7,.3,1) both}
.gym-p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.gym-sec{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start;
  padding:8px 0;border-top:1px dashed #F1E4CC;margin-top:2px}
.gym-p-head + .gym-sec{border-top:0;margin-top:6px}
.gym-sec-t{font-size:11.5px;color:var(--ink-3);padding-top:5px;letter-spacing:.08em}
.gym-sec-c{display:flex;flex-wrap:wrap;gap:6px}
.gym-p-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:8px;padding-top:10px;border-top:1px dashed #F1E4CC}
.gym-p-sum{font-size:11.5px;color:var(--ink-2)}
.chip.gk{font-size:11.5px;padding:4px 10px}
.chip.gk-a.on{background:#E6EDDF;border-color:#B9C7AC;color:#4F6045;font-weight:500}
.chip.gk-s.on{background:#F7E7D8;border-color:#DDBB9C;color:#8A5F3C;font-weight:500}
.chip.gh.on{background:var(--yolk);border-color:var(--yolk-deep);color:#4A3E22;font-weight:600}
.ga-sep{width:1px;align-self:stretch;background:#EEDFC6;margin:0 3px}
.ga-hours{padding:2px 5px;font-size:11px;width:auto;height:auto;border-radius:8px;
  border:1px solid var(--line-2);background:var(--paper)}
.gym-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);transition:.15s}
.chip:hover{border-color:#D8C9AC}
.chip.on{color:#2B2724;font-weight:500}

/* ---------- 工作复盘 ---------- */
.lock-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 24px}
.lock-egg{width:50px;color:#B9A57C;margin-bottom:12px}
.lock-card h2{font-size:16px;font-weight:600}
.lock-sub{font-size:12.5px;color:var(--ink-3);margin:6px 0 16px}
.lock-row{display:flex;gap:8px;max-width:300px;width:100%}
.lock-row input{text-align:center}
.lock-err{font-size:12px;color:#B4564A;margin-top:10px}
.lock-note{font-size:11.5px;color:var(--ink-3);margin-top:14px;max-width:300px;line-height:1.6}
.lock-inline{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 12px}
.lock-inline .lock-egg{width:38px;margin-bottom:8px}
.lock-inline h2{font-size:14px}
.lock-inline .lock-row{max-width:280px}
.rev-stats{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin-bottom:16px}
.rev-stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow)}
.rev-stat span{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
.rev-stat b{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.rev-stat i{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:3px}
.rev-stat.wide b{font-size:14px;letter-spacing:0;font-weight:500;line-height:1.4}
.rev-timeline{position:relative;padding-left:24px}
.rev-timeline:before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:1px;background:var(--line-2)}
.rev-item{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.rev-item:before{content:"";position:absolute;left:-22px;top:25px;width:9px;height:9px;border-radius:50%;background:var(--yolk);border:2px solid #FDFAF3;box-shadow:0 0 0 1px var(--line-2)}
.rev-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rev-title{font-size:15.5px;font-weight:600}
.rev-status{font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px}
.rev-meta{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.rev-summary{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.65}
.rev-kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kpi{display:flex;align-items:baseline;gap:2px;background:var(--paper-warm);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.kpi b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.kpi em{font-style:normal;font-size:10.5px;color:var(--ink-3);margin-left:5px}
.rev-dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 22px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.dim{display:grid;grid-template-columns:64px minmax(0,1fr) 16px;gap:8px;align-items:center}
.dim-name{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim-bar{height:6px;background:#F4EBD8;border-radius:99px;overflow:hidden}
.dim-bar i{display:block;height:100%;background:var(--yolk);border-radius:99px}
.dim-val{font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.rev-doc{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:10px}
.rev-doc summary{list-style:none;cursor:pointer;font-size:12px;color:var(--caramel);display:inline-flex;align-items:center;gap:5px}
.rev-doc summary::-webkit-details-marker{display:none}
.rev-doc summary:before{content:"▸";font-size:10px}
.rev-doc[open] summary:before{content:"▾"}
.rev-body{font-size:13px;line-height:1.85;color:var(--ink-2);white-space:pre-wrap;margin-top:10px;background:var(--paper-warm);border-radius:12px;padding:14px 16px}

/* ---------- 新积木的后台表单 ---------- */
.sub-head.first{margin-top:0;padding-top:0;border-top:0}
.sub-head.tight{margin:14px 0 8px;padding-top:12px}
.row-period{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:8px;align-items:center;max-width:340px}
.row-slot{display:grid;grid-template-columns:92px 128px minmax(0,1fr) 104px 28px;gap:8px;align-items:center}
.row-kb{display:grid;grid-template-columns:1.6fr 116px 130px 28px;gap:8px;align-items:center}
.row-kb-sub{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:6px}
.kb-edit{padding:11px 0;border-bottom:1px dashed #F1E8D7}
.kb-edit:last-child{border-bottom:0}
.rev-edit-item{padding:12px 0;border-bottom:1px dashed #F1E8D7}
.row-rv{display:grid;grid-template-columns:84px minmax(0,1fr) 150px 28px;gap:8px;align-items:center}
.row-rv-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rv-range{display:flex;align-items:center;gap:6px}
.rv-range span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.row-ld{display:grid;grid-template-columns:130px minmax(0,1fr) 94px 88px 28px;gap:8px;align-items:center}
.pp-edit{padding:11px 0;border-bottom:1px dashed #F1E8D7}
.pp-edit:last-child{border-bottom:0}
.row-pp{display:grid;grid-template-columns:minmax(0,1fr) 76px 128px 96px 28px;gap:8px;align-items:center}
.pp-note-in{margin-top:6px}
.row-tag{display:grid;grid-template-columns:42px minmax(0,1fr) 28px;gap:8px;align-items:center;max-width:320px}
.gym-admin-days{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;padding-right:4px}
.gym-admin-day{display:grid;grid-template-columns:56px minmax(0,1fr) 28px;gap:8px;align-items:center}
.gym-admin-chips{display:flex;flex-wrap:wrap;gap:5px}
.gym-admin-chips .chip{padding:2px 8px;font-size:11px}
.row-kpi-edit{display:grid;grid-template-columns:minmax(0,1fr) 84px 68px 28px;gap:8px;align-items:center;margin-bottom:6px}
.score-row{display:grid;grid-template-columns:92px minmax(0,1fr) 20px;gap:10px;align-items:center;margin-bottom:6px}
.score-row span{font-size:12px;color:var(--ink-2)}
.score-row b{font-size:12px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- 蛋搭子（每个板块页右下角） ---------- */
.egg-pal{position:fixed;right:22px;bottom:20px;z-index:30;width:58px;height:66px;
  border-radius:50% 50% 46% 46%/56% 56% 44% 44%;border:1px solid var(--line);
  background:linear-gradient(180deg,#FFFEF9,#FBF1DB);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px -4px rgba(43,39,36,.35),inset 0 -3px 6px -4px rgba(140,122,85,.5);
  transition:transform .18s ease}
.egg-pal .egg{width:32px;color:#8C7A55}
.egg-pal:hover{transform:translateY(-3px) rotate(-3deg)}
.egg-pal.boing{animation:boing .62s cubic-bezier(.2,.8,.3,1)}
.pal-bubble{position:absolute;bottom:calc(100% + 9px);right:-4px;min-width:150px;max-width:230px;
  background:var(--ink);color:#FFF8EA;font-size:11.5px;line-height:1.55;padding:8px 11px;
  border-radius:11px 11px 11px 3px;opacity:0;transform:translateY(5px);pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;white-space:normal;text-align:left}
.pal-bubble.show{opacity:1;transform:none}
@keyframes boing{
  0%{transform:scale(1) rotate(0)}
  28%{transform:scale(1.14,.86) rotate(-8deg)}
  52%{transform:scale(.92,1.1) rotate(6deg)}
  76%{transform:scale(1.05,.96) rotate(-3deg)}
  100%{transform:scale(1) rotate(0)}
}
.head-egg{cursor:pointer;border:0;background:transparent;padding:0;position:relative}
.head-egg.boing{animation:boing .62s cubic-bezier(.2,.8,.3,1)}
.egg-family{display:flex;gap:14px;justify-content:center;padding:10px 0 16px}
.egg-fam{border:0;background:transparent;padding:0;cursor:pointer;color:#C9BB9B;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),color .2s ease}
.egg-fam .egg{width:26px;height:32px}
.egg-fam:hover{color:#8C7A55;transform:translateY(-5px) rotate(-6deg)}
.egg-fam:active{transform:scale(.9)}
.egg-fam.boing{animation:boing .62s cubic-bezier(.2,.8,.3,1)}
.block-form.flash{animation:flashRing 1.4s ease}
@keyframes flashRing{
  0%{box-shadow:0 0 0 0 rgba(239,196,99,.85);border-color:var(--yolk-deep)}
  100%{box-shadow:0 0 0 14px rgba(239,196,99,0);border-color:var(--line)}
}

}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 动效 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes growW{from{width:0}}
@keyframes barUp{from{height:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dashIn{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes drawLink{from{stroke-dashoffset:18;opacity:0}to{stroke-dashoffset:0;opacity:1}}

/* ---------- 交互手感 ---------- */
/* 进入页面：卡片依次浮上来 */
.view > *{animation:rise .44s cubic-bezier(.2,.75,.3,1) both}
.view > *:nth-child(1){animation-delay:.01s}
.view > *:nth-child(2){animation-delay:.05s}
.view > *:nth-child(3){animation-delay:.09s}
.view > *:nth-child(4){animation-delay:.13s}
.view > *:nth-child(5){animation-delay:.16s}
.view > *:nth-child(6){animation-delay:.19s}
.view > *:nth-child(7){animation-delay:.22s}
.view > *:nth-child(n+8){animation-delay:.24s}
.page-head{animation:rise .4s cubic-bezier(.2,.75,.3,1) both}

/* 进度条 / 柱状图：从零长出来 */
.bar i,.led-cat-bar i,.dim-bar i{animation:growW .7s cubic-bezier(.2,.8,.3,1) both}
.tr-bar{animation:barUp .62s cubic-bezier(.2,.8,.3,1) both}

/* 打卡格子：按下去有回弹 */
.cell{transition:transform .14s ease,background .18s ease,border-color .18s ease}
.cell:not([disabled]):active{transform:scale(.86)}
.cell.on{animation:pop .3s cubic-bezier(.2,.8,.3,1)}

/* 三件事：勾上时轻轻一顿 */
.top3-item{transition:background .2s ease}
.top3-item.done .top3-text{transition:color .3s ease,opacity .3s ease}
.top3-item.done .check{animation:pop .32s cubic-bezier(.2,.8,.3,1)}
.check{transition:transform .16s ease,background .18s ease,border-color .18s ease}
.check:active{transform:scale(.9)}

/* 大数字：出现时跳一下 */
.big-num,.rev-stat b,.led-kpi b{animation:pop .36s cubic-bezier(.2,.8,.3,1) both}
.head-egg .egg,.goal-egg .egg{animation:breath 6s ease-in-out infinite}

/* 按钮手感 */
.btn{transition:transform .14s ease,background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease}
.btn:active{transform:scale(.97)}
.chip,.qa-chip,.icon-btn{transition:transform .14s ease,background .16s ease,border-color .16s ease,color .16s ease}
.chip:active,.icon-btn:active{transform:scale(.94)}

/* 桌面端：卡片可以“抬起来” */
@media (hover:hover) and (pointer:fine){
  .card{transition:box-shadow .24s ease,transform .24s ease,border-color .24s ease}

    box-shadow:0 2px 4px rgba(43,39,36,.05),0 24px 48px -32px rgba(43,39,36,.55)}
  .rev-item{transition:transform .2s ease,box-shadow .2s ease}
  .rev-item:hover{transform:translateY(-2px);box-shadow:0 16px 32px -26px rgba(43,39,36,.5)}
  .top3-item:hover{background:#FFFCF4}
  .qa-chip:hover{transform:translateY(-2px)}
}

@media (max-width:760px){

  .pp-list-m{display:flex}
}

  .gym-admin-day{grid-template-columns:46px minmax(0,1fr) 24px}
}

/* 迁移表：以后要加字段/改结构时，在这里按版本号补一个函数。
   例：MIGRATIONS[2] = function(s){ s.newField = 0; return s; };
   读取旧数据时会依次执行，执行完再交给 normalize 补默认值。
   MIGRATIONS[n] 负责把 n 版数据升到 n+1 版，只补不改，绝不删用户的板块。 */
var MIGRATIONS = [
  /* v1 → v2：新增课表/看板/灵感/影评书评/记账/数值追踪/人物树/健身/复盘九种积木。
     老板块的数据结构一个字段都没动，所以这一步不需要改写任何内容，
     只给老数据打个标记，方便以后回溯。 */
  function(s){
    s.meta = isObj(s.meta) ? s.meta : {};
    if(!s.meta.upgradedTo2) s.meta.upgradedTo2 = new Date().toISOString();
    return s;
  },
  /* v2 → v3：补两个预设数值追踪板块（喝水 / 背单词）。已有的同名板块不重复加。 */
  function(s){
    s.meta = isObj(s.meta) ? s.meta : {};
    if(s.meta.presetsV3) return s;
    s.meta.presetsV3 = new Date().toISOString();
    s.blocks = Array.isArray(s.blocks) ? s.blocks : [];
    var has = function(label){
      return s.blocks.some(function(b){ return b && b.type === 'tracker' && str((b.data||{}).label) === label; });
    };
    if(!has('喝水')){
      s.blocks.push({ id:uid('b'), type:'tracker', title:'喝水',

  }
];

function uid(p){ return p + '_' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,6); }
function isObj(o){ return !!o && typeof o === 'object' && !Array.isArray(o); }
function str(v, d){ if(typeof v === 'string') return v; if(typeof v === 'number') return String(v); return d == null ? '' : d; }
function deepClone(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return o; } }

function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayYmd(){ return ymd(new Date()); }
function isDateStr(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !!parseYmd(s); }
function parseYmd(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m) return null;
  var d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  if(isNaN(d.getTime())) return null;
  if(d.getMonth() !== Number(m[2])-1) return null;
  return d;
}
function addDays(s, n){
  var d = parseYmd(s) || new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function diffDays(from, to){
  var a = parseYmd(from), b = parseYmd(to);
  if(!a || !b) return null;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function lastDays(n){
  var out = [], t = todayYmd();
  for(var i = n-1; i >= 0; i--) out.push(addDays(t, -i));
  return out;
}
function fmtMD(s){ var d = parseYmd(s); return d ? (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日' : ''; }
function weekday(s){ var d = parseYmd(s); return d ? '周' + '日一二三四五六'.charAt(d.getDay()) : ''; }
function fmtFullDate(s){
  var d = parseYmd(s);
  if(!d) return '';
  return d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日 · ' + weekday(s);
}
function shortDay(s){
  var t = todayYmd();
  var n = diffDays(t, s);
  if(n === 0) return '今天';
  if(n === 1) return '明天';
  if(n === 2) return '后天';
  if(n === null) return '—';
  if(n > 0) return (n) + ' 天后';
  return '已过';
}
function relTag(s){
  var n = diffDays(todayYmd(), s);
  if(n === 0) return '<span class="rel-tag">今天</span>';
  if(n === 1) return '<span class="rel-tag">明天</span>';
  if(n === 2) return '<span class="rel-tag">后天</span>';
  return '';
}
function greeting(){
  var h = new Date().getHours();
  if(h < 5) return '夜深了';
  if(h < 9) return '早上好';
  if(h < 12) return '上午好';
  if(h < 14) return '中午好';
  if(h < 18) return '下午好';
  return '晚上好';
}
function fmtTime(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function clampPct(v){
  var n = Number(v);
  if(!isFinite(n)) return 0;
  return Math.max(0, Math.min(100, Math.round(n)));
}
function clampInt(v, min, max, def){
  var n = Math.round(Number(v));
  if(!isFinite(n)) return def == null ? min : def;
  return Math.max(min, Math.min(max, n));
}
function numOr(v, def){
  if(v === '' || v == null) return def;
  var n = Number(v);
  return isFinite(n) ? n : def;
}
function money(n){
  var v = Math.round(Number(n) || 0);
  return '¥' + v.toLocaleString('zh-CN');
}
function monthsBetween(a, b){
  var A = parseYmd(a), B = parseYmd(b);
  if(!A || !B) return 0;
  return Math.max(1, (B.getFullYear() - A.getFullYear()) * 12 + (B.getMonth() - A.getMonth()) + 1);
}
function fmtYM(s){
  var d = parseYmd(s);
  return d ? (d.getFullYear() + '.' + pad(d.getMonth() + 1)) : '';
}
function starsHTML(n){
  var v = clampInt(n, 0, 5, 0), s = '';
  for(var i = 1; i <= 5; i++) s += '<span class="star' + (i <= v ? ' on' : '') + '">★</span>';

function extra(src, known){
  var o = {};
  Object.keys(src).forEach(function(k){ if(!(k in known)) o[k] = src[k]; });
  return o;
}

function normalizeTop3(arr){
  var t = todayYmd(), src = Array.isArray(arr) ? arr : [];
  return [0,1,2].map(function(i){
    var it = isObj(src[i]) ? src[i] : {};
    var o = {
      id: str(it.id) || uid('t'),
      text: str(it.text),
      done: !!it.done,
      date: isDateStr(it.date) ? it.date : t
    };
    Object.assign(o, extra(it, { id:1, text:1, done:1, date:1 }));
    return o;
  });
}

function nGoalData(d){
  d = isObj(d) ? d : {};
  var progress = (Array.isArray(d.progress) ? d.progress : []).filter(isObj).map(function(p){
    var o = {
      id: str(p.id) || uid('p'),
      name: str(p.name),
      pct: p.pct === '' ? '' : clampPct(p.pct),
      note: str(p.note)
    };
    Object.assign(o, extra(p, { id:1, name:1, pct:1, note:1 }));
    return o;
  });
  var notes = (Array.isArray(d.notes) ? d.notes : []).filter(isObj).map(function(n){
    var o = {
      id: str(n.id) || uid('n'),
      date: isDateStr(n.date) ? n.date : '',
      text: str(n.text)
    };
    Object.assign(o, extra(n, { id:1, date:1, text:1 }));
    return o;
  });
  var out = { goal: str(d.goal), dueDate: isDateStr(d.dueDate) ? d.dueDate : '', progress: progress, notes: notes };
  Object.assign(out, extra(d, out));
  return out;
}

function nAgendaData(d){
  d = isObj(d) ? d : {};
  var cats = Array.isArray(d.categories) ? d.categories.filter(function(x){ return typeof x === 'string' && x.trim(); }) : [];
  if(!cats.length) cats = ['工作','生活','学习','健康'];
  var items = (Array.isArray(d.items) ? d.items : []).filter(isObj).map(function(it){
    var o = {
      id: str(it.id) || uid('a'),
      date: isDateStr(it.date) ? it.date : '',
      text: str(it.text),
      type: str(it.type)
    };
    Object.assign(o, extra(it, { id:1, date:1, text:1, type:1 }));
    return o;
  });
  var out = { categories: cats, items: items };
  Object.assign(out, extra(d, out));
  return out;
}

function nHabitData(d){
  d = isObj(d) ? d : {};
  var habits = (Array.isArray(d.habits) ? d.habits : []).filter(isObj).map(function(h){
    var o = { id: str(h.id) || uid('h'), name: str(h.name) };
    Object.assign(o, extra(h, { id:1, name:1 }));
    return o;
  });
  var log = {};
  var byHabit = {}, byDate = {};
  if(isObj(d.log)){
    Object.keys(d.log).forEach(function(k){
      var src = d.log[k];
      if(!isObj(src)) return;
      /* 标准写法：log[习惯 id][日期] = true
         也容忍反过来的写法（手工改过备份文件的情况）：log[日期][习惯 id] = true */
      if(isDateStr(k)) byDate[k] = src; else byHabit[k] = src;

function nVocabData(d){
  d = isObj(d) ? d : {};
  var known = {};
  ['en','es'].forEach(function(lang){
    var src = isObj(d.known) && isObj(d.known[lang]) ? d.known[lang] : {};
    var m = {};
    Object.keys(src).forEach(function(k){
      if(/^\d+$/.test(k)) m[Number(k)] = true;
    });
    known[lang] = m;
  });
  var out = {
    lang: d.lang === 'es' ? 'es' : 'en',
    seq: clampInt(d.seq, 0, 999999, 0),
    known: known
  };
  Object.assign(out, extra(d, out));
  return out;
}
function vocabList(lang){ return WORDS[lang] || []; }
function vocabStats(d){
  var list = vocabList(d.lang);
  var known = d.known[d.lang] || {};
  var n = 0;
  Object.keys(known).forEach(function(k){ if(known[k] && Number(k) < list.length) n++; });
  return { total: list.length, known: n };
}
function vocabNext(d){
  /* 跳到第一个还没记住的词；全记住了就从头循环 */
  var list = vocabList(d.lang);
  if(!list.length) return 0;
  var known = d.known[d.lang] || {};
  var i = d.seq;
  for(var g = 0; g < list.length; g++){
    var j = (i + g) % list.length;
    if(!known[j]) return j;
  }
  return i % list.length;
}

function nTrackerData(d){
  d = isObj(d) ? d : {};
  var records = {};
  if(isObj(d.records)){
    Object.keys(d.records).forEach(function(k){
      if(!isDateStr(k)) return;
      var n = Number(d.records[k]);
      if(isFinite(n) && d.records[k] !== '' && d.records[k] != null) records[k] = n;
    });
  }
  var out = {
    label: str(d.label) || '睡眠',
    unit: str(d.unit) || '小时',
    target: numOr(d.target, 8),
    lowAt: numOr(d.lowAt, 6),
    records: records
  };
  Object.assign(out, extra(d, out));
  return out;
}

function nPeopleData(d){
  d = isObj(d) ? d : {};
  var list = (Array.isArray(d.list) ? d.list : []).filter(isObj).map(function(p){
    var o = {
      id: str(p.id) || uid('c'),

      relation: str(p.relation),
      last: isDateStr(p.last) ? p.last : '',
      birthday: brithNorm(p.birthday),
      note: str(p.note)
    };
    Object.assign(o, extra(p, { id:1, name:1, relation:1, last:1, birthday:1, note:1 }));

}
function brithNorm(v){
  var s = str(v).trim();
  if(!s) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m) return m[2] + '-' + m[3];
  m = /^(\d{1,2})[-/.](\d{1,2})$/.exec(s);
  if(m) return pad(Number(m[1])) + '-' + pad(Number(m[2]));
  return '';
}

  aerobic: ['动感单车','爬坡','爬山','徒步','跳舞','乒乓球'],

function nGymKinds(src){
  var s = isObj(src) ? src : {};
  var out = {};
  ['aerobic','strength'].forEach(function(g){
    var arr = s[g];
    if(typeof arr === 'string') arr = arr.split(/[,，、;；]/);
    if(!Array.isArray(arr) || !arr.length) arr = GYM_KINDS_DEFAULT[g].slice();
    out[g] = arr.map(function(x){ return str(x).trim(); }).filter(Boolean).slice(0, 24);
  });
  return out;
}
function nGymDay(v){
  /* 兼容最早那种「一天 = 标签 id 数组」的写法 */
  if(Array.isArray(v)){
    return { tags: v.filter(function(x){ return typeof x === 'string'; }), kinds: [], hours: 0 };
  }
  v = isObj(v) ? v : {};
  var tags = Array.isArray(v.tags) ? v.tags.filter(function(x){ return typeof x === 'string'; }) : [];
  var kinds = (Array.isArray(v.kinds) ? v.kinds : []).filter(isObj).map(function(k){
    var g = k.g === 'strength' ? 'strength' : (k.g === 'aerobic' ? 'aerobic' : '');
    var n = str(k.n).trim();
    return (g && n) ? { g:g, n:n } : null;
  }).filter(Boolean);
  var hours = clampInt(v.hours, 0, 24, 0);
  var out = { tags: tags, kinds: kinds, hours: hours };
  Object.assign(out, extra(v, out));
  return out;
}
function gymDone(day){ return !!day && ((day.tags && day.tags.length > 0) || (day.kinds && day.kinds.length > 0) || day.hours > 0); }
function gymSummary(day){
  if(!day) return '';
  var parts = [];
  if(day.kinds && day.kinds.length) parts.push(day.kinds.map(function(k){ return k.n; }).join('·'));
  if(day.hours) parts.push(day.hours + 'h');
  if(!parts.length && day.tags && day.tags.length) parts.push(day.tags.length + ' 个标签');
  return parts.join(' · ');
}

function normalize(s){
  s = isObj(s) ? s : {};
  var out = {
    schemaVersion: SCHEMA_VERSION,
    updatedAt: str(s.updatedAt) || new Date().toISOString(),
    settings: {
      title: str((s.settings||{}).title) || 'egg 的个人工作台',

    },
    overview: { top3: normalizeTop3((s.overview||{}).top3) },
    blocks: (Array.isArray(s.blocks) ? s.blocks : []).map(normalizeBlock).filter(Boolean),
    meta: isObj(s.meta) ? s.meta : {}
  };
  /* 保留当前版本不认识的字段，避免旧页面打开新数据时“洗掉”东西 */
  if(isObj(s.settings)) Object.assign(out.settings, extra(s.settings, out.settings));
  if(isObj(s.overview)) Object.assign(out.overview, extra(s.overview, out.overview));
  Object.assign(out, extra(s, out));
  return out;
}

function migrate(raw){
  var s = isObj(raw) ? deepClone(raw) : blankState();
  var v = Number(s.schemaVersion) || 1;
  var guard = 0;
  while(v < SCHEMA_VERSION && guard < 50){
    var fn = MIGRATIONS[v-1];
    if(typeof fn === 'function'){ s = fn(s) || s; }
    v++; guard++;
  }
  s.schemaVersion = SCHEMA_VERSION;
  return normalize(s);
}

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function safeRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

var state;
var saveTimer = null;
var dirty = false;
var bootWarn = '';

/* 网页文件里自带的数据快照（「存一份带数据的网页」时写进去的）。
   换浏览器、换设备打开这个文件，就从这份快照恢复。 */
function readEmbedded(){
  try{
    var el = document.getElementById('eggSeed');
    if(!el) return null;
    var t = String(el.textContent || '').trim();
    if(!t || t === 'null') return null;
    var o = JSON.parse(t);
    return (isObj(o) && Array.isArray(o.blocks)) ? o : null;
  }catch(e){ return null; }
}

function boot(){
  var raw = safeGet(DB_KEY);
  var emb = readEmbedded();
  var embAt = emb ? String(emb.updatedAt || '') : '';
  var rawAt = '';
  if(raw){ try{ rawAt = String(JSON.parse(raw).updatedAt || ''); }catch(e){} }
  /* 文件里的数据比浏览器里的新（或者浏览器里压根没有）→ 用文件里的 */
  if(emb && (!raw || (embAt && rawAt && embAt > rawAt))){
    try{
      state = migrate(emb);
      safeSet(DB_KEY, JSON.stringify(state));
      bootWarn = raw
        ? '网页文件里带的数据比浏览器里的新，已经用文件里的（' + state.blocks.length + ' 个板块）'
        : '已从网页文件自带的数据恢复：' + state.blocks.length + ' 个板块都在';
      return;
    }catch(e){}
  }
  if(raw == null){
    freshBoot = true;
    state = seedState();
    writeStore();
    return;
  }
  try{
    state = migrate(JSON.parse(raw));
    /* 规范化 / 升级后的结构立刻落盘，下次读到就是新结构。
       这里不刷新 updatedAt，保留真实的“最后修改时间”。 */
    safeSet(DB_KEY, JSON.stringify(state));
  }catch(err){
    var key = DB_KEY + '.corrupt.' + Date.now();
    safeSet(key, raw);
    if(emb){
      state = migrate(emb);
      writeStore();
      bootWarn = '浏览器里的数据读不出来（已留了备份），先用网页文件里带的数据启动了。';
      return;
    }
    state = blankState();
    writeStore();
    bootWarn = '原来的数据读不出来，已原样备份在浏览器里，先用空白工作台启动。';
  }
}

function writeStore(){
  state.updatedAt = new Date().toISOString();
  var ok = safeSet(DB_KEY, JSON.stringify(state));
  dirty = !ok;
  setSaveTag(ok ? 'saved' : 'error');
  if(!ok) quotaWarn();
  syncWriteSoon();
  return ok;
}
function scheduleSave(){
  dirty = true;
  setSaveTag('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ writeStore(); }, 320);
}
function saveNow(){
  clearTimeout(saveTimer);
  return writeStore();
}

var IMG_MAXPX = 1000, IMG_QUALITY = 0.78;
var imgTarget = null;   /* { bid, path } 目标数组 */
var imgWarnAt = 0;

function nImgs(arr){
  return (Array.isArray(arr) ? arr : []).filter(function(x){
    return typeof x === 'string' && x.slice(0, 5) === 'data:' && x.length < 3 * 1024 * 1024;
  }).slice(0, 24);
}
function quotaWarn(){
  var now = Date.now();
  if(now - imgWarnAt < 60000) return;
  imgWarnAt = now;
  toast('浏览器存储快满了，删几张图片或下载备份');
}
function imgFromFile(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var src = String(fr.result || '');
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth || 100, h = img.naturalHeight || 100;
        var scale = Math.min(1, IMG_MAXPX / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * scale));
        cv.height = Math.max(1, Math.round(h * scale));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', IMG_QUALITY));
      }catch(e){ cb(src); }
    };
    img.onerror = function(){ cb(src); };
    img.src = src;
  };
  fr.onerror = function(){ cb(''); };
  fr.readAsDataURL(file);
}
function imgsHTML(bid, path, arr, editable){
  if(!arr || !arr.length) return '';
  return '<div class="imgs">' + arr.map(function(src, i){

/* =========================================================
   3.5 本地数据文件自动同步（可选）
   绑定一个本地 json 文件后：每次修改自动写进去；
   浏览器数据被清掉时，重新打开页面会自动从文件恢复。
   备份 / 恢复按钮不受影响。
   ========================================================= */
var syncHandle = null;      /* 已授权的文件句柄 */
var syncPending = null;     /* 记住了文件但需要重新授权 */
var syncName = '';
var syncTimer = null;
var freshBoot = false;

function idbOpen(){
  return new Promise(function(res, rej){
    try{
      var rq = indexedDB.open('eggWorkbenchSync', 1);
      rq.onupgradeneeded = function(){ try{ rq.result.createObjectStore('h'); }catch(e){} };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    }catch(e){ rej(e); }
  });
}
function idbSet(k, v){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('h', 'readwrite');
      tx.objectStore('h').put(v, k);
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ rej(tx.error); };
    });
  }).catch(function(){ return false; });
}
function idbGet(k){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('h', 'readonly');
      var rq = tx.objectStore('h').get(k);
      rq.onsuccess = function(){ res(rq.result || null); };
      rq.onerror = function(){ rej(rq.error); };
    });
  }).catch(function(){ return null; });
}
function syncStatus(){
  if(syncHandle) return 'bound';
  if(syncPending) return 'pending';
  return 'none';
}
function syncWriteNow(){
  if(!syncHandle) return;
  try{
    var h = syncHandle;
    h.createWritable().then(function(w){
      return w.write(JSON.stringify(state)).then(function(){ return w.close(); });
    }).catch(function(){});
  }catch(e){}
}
function syncWriteSoon(){
  if(!syncHandle) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncWriteNow, 500);
}
function syncPick(){
  if(!window.showSaveFilePicker){
    toast('这个浏览器不支持绑定本地文件，用 Edge 或 Chrome 打开试试');
    return;
  }
  window.showSaveFilePicker({
    suggestedName: 'egg-workbench-data.json',
    types: [{ description:'JSON 数据文件', accept: { 'application/json': ['.json'] } }]
  }).then(function(h){
    syncHandle = h; syncPending = null;
    try{ syncName = h.name || 'egg-workbench-data.json'; }catch(e){ syncName = 'egg-workbench-data.json'; }
    idbSet('handle', h);
    syncWriteNow();
    toast('已绑定「' + syncName + '」，以后每次修改都会自动写进去');
    render();
  }).catch(function(){ /* 用户取消 */ });
}
function syncGrant(){
  if(!syncPending || !syncPending.requestPermission) return;
  syncPending.requestPermission({ mode:'readwrite' }).then(function(r){
    if(r === 'granted'){
      syncHandle = syncPending; syncPending = null;
      try{ syncName = syncHandle.name || syncName; }catch(e){}
      syncWriteNow();
      toast('已重新授权，继续自动同步');
      render();
    }else{
      toast('没有授权，文件同步先停着');
    }
  }).catch(function(){});
}
function syncUnbind(){
  syncHandle = null; syncPending = null; syncName = '';
  idbSet('handle', null);
  toast('已解除绑定，备份 / 恢复按钮不受影响');
  render();
}
function syncBoot(){
  return idbGet('handle').then(function(h){
    if(!h || !h.queryPermission) return;
    return h.queryPermission({ mode:'readwrite' }).then(function(perm){
      if(perm === 'granted'){
        syncHandle = h;
        try{ syncName = h.name || ''; }catch(e){}
      }else{
        syncPending = h;
        try{ syncName = h.name || ''; }catch(e){}
      }
    });
  }).catch(function(){}).then(function(){
    if(!syncHandle) return;
    if(freshBoot){
      /* 浏览器数据被清了：从文件把工作台救回来 */
      return syncHandle.getFile().then(function(f){
        return f.text();
      }).then(function(txt){
        if(!txt) return;
        var parsed = null;
        try{ parsed = JSON.parse(txt); }catch(e){}
        if(parsed && Array.isArray(parsed.blocks) && parsed.blocks.length){
          state = migrate(parsed);
          saveNow();
          render();
          toast('浏览器里的数据没了，已经从本地文件「' + (syncName || '数据文件') + '」恢复');
        }
      }).catch(function(){});
    }else{
      syncWriteNow();   /* 页面打开时把文件刷成最新 */
    }
  });
}

function setSaveTag(mode){
  var line = $('#saveLine'), text = $('#saveText');
  if(!line || !text) return;

  text.textContent = mode === 'saving' ? '保存中…' : mode === 'error' ? '保存失败' : '已保存 ' + fmtTime(new Date().toISOString());

   4. 计算
   ========================================================= */
function blockById(id){ return state.blocks.filter(function(b){ return b.id === id; })[0]; }
function firstOfType(t){ return state.blocks.filter(function(b){ return b.type === t; })[0]; }

function isDone(b, hid, date){
  var m = b.data.log && b.data.log[hid];
  return !!(m && m[date]);
}
function habitStreak(b, hid){
  var n = 0, cur = todayYmd();
  if(!isDone(b, hid, cur)) cur = addDays(cur, -1);
  var guard = 0;
  while(isDone(b, hid, cur) && guard < 4000){ n++; cur = addDays(cur, -1); guard++; }
  return n;
}
function allDone(b, date){
  var hs = b.data.habits || [];
  if(!hs.length) return false;
  return hs.every(function(h){ return isDone(b, h.id, date); });
}
function globalStreak(b){
  if(!b) return 0;
  var n = 0, cur = todayYmd();
  if(!allDone(b, cur)) cur = addDays(cur, -1);
  var guard = 0;
  while(allDone(b, cur) && guard < 4000){ n++; cur = addDays(cur, -1); guard++; }
  return n;
}

function upcoming(days){
  var t = todayYmd(), out = [];
  state.blocks.forEach(function(b){
    if(b.type !== 'agenda') return;
    (b.data.items || []).forEach(function(it){
      var n = diffDays(t, it.date);
      if(n !== null && n >= 0 && n < days) out.push({ date: it.date, text: it.text, type: it.type, bid: b.id });
    });
  });
  out.sort(function(a, b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return String(a.text).localeCompare(String(b.text));
  });
  return out;
}

function syncDay(){
  var t = todayYmd(), changed = false;
  state.overview.top3.forEach(function(it){
    if(it.date !== t){ it.date = t; it.done = false; changed = true; }
  });
  if(changed) scheduleSave();
  return changed;
}

/* ---------- 未来 8 周分布（高压周） ---------- */
function weekCounts(items, weeks){
  var t = todayYmd();
  var pd = parseYmd(t);
  if(!pd) return [];
  var dow = (pd.getDay() + 6) % 7;
  var monday = addDays(t, -dow);
  var out = [];
  for(var i = 0; i < weeks; i++) out.push(0);
  items.forEach(function(it){
    if(!isDateStr(it.date)) return;
    var d = diffDays(monday, it.date);
    if(d < 0) return;
    var w = Math.floor(d / 7);
    if(w < weeks) out[w]++;
  });
  return out;
}

function guessCat(text){
  if(/饭|食|堂|早|午|晚|面|米|菜|外卖|吃/.test(text)) return '吃饭';
  if(/奶茶|茶|咖啡|电影|剧|游戏|玩|票|演出|零食|饮/.test(text)) return '娱乐';
  if(/车|地铁|公交|打车|火车|机票|船|加油|骑/.test(text)) return '交通';
  if(/书|打印|复印|笔|课|学|纸|本子/.test(text)) return '学习';
  return '日用';
}

function viewGoal(b){
  var d = b.data;
  var n = diffDays(todayYmd(), d.dueDate);
  var big = '—', unit = '', sub = '还没设置目标日期';
  if(n !== null){
    if(n > 0){ big = n; unit = '天'; sub = '距离目标还有'; }
    else if(n === 0){ big = '今天'; sub = '目标日就是今天'; }
    else { big = Math.abs(n); unit = '天'; sub = '目标日期已经过去'; }
  }
  var avg = d.progress.length
    ? Math.round(d.progress.reduce(function(s, p){ return s + clampPct(p.pct); }, 0) / d.progress.length)
    : 0;

  var hero = '<section class="card goal-hero">' +
      '<div>' +
        '<p class="eyebrow">' + (d.goal ? esc(d.goal) : '还没有目标名称') + '</p>' +
        '<div class="num-row"><span class="big-num">' + big + '</span>' +
          (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>' +
        '<p class="mini-sub">' + sub + (d.dueDate ? ' · ' + fmtMD(d.dueDate) : '') + '</p>' +
      '</div>' +
      '<div class="goal-egg">' + eggIcon('crack') + '</div>' +
    '</section>';

  var prog = '<section class="card">' +
      '<div class="card-head"><h2>进度</h2><span class="hint">平均 ' + avg + '%</span></div>' +
      (d.progress.length
        ? '<div class="progress-list">' + d.progress.map(function(p){
            var v = clampPct(p.pct);
            return '<div class="p-item">' +
              '<div class="p-row"><span class="p-name">' + (esc(p.name) || '未命名进度') + '</span>' +
                '<span class="p-pct">' + v + '%</span></div>' +
              '<div class="bar"><i class="' + (v >= 100 ? 'full' : '') + '" style="width:' + v + '%"></i></div>' +
              (p.note ? '<p class="p-note">' + esc(p.note) + '</p>' : '') +
            '</div>';
          }).join('') + '</div>'
        : emptyBox('还没有进度，去后台加一条', '#/admin', '去后台')) +
    '</section>';

  var sortedNotes = d.notes.slice().sort(function(a, b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return 0;
  });
  var notes = '<section class="card">' +
      '<div class="card-head"><h2>本子</h2><span class="hint">' + d.notes.length + ' 条</span></div>' +
      (sortedNotes.length
        ? '<ul class="notes">' + sortedNotes.map(function(nt){
            return '<li><span class="note-date">' + (nt.date ? fmtMD(nt.date).replace(/ 月 /, '/').replace(/ 日/, '') : '—') + '</span>' +
              '<span class="note-text">' + (esc(nt.text) || '<span class="muted">（空白）</span>') + '</span></li>';
          }).join('') + '</ul>'
        : emptyBox('本子还是空的，记第一条吧', '#/admin', '去后台')) +
    '</section>';

  return hero + prog + notes;
}

function viewAgenda(b){
  var d = b.data;
  var t = todayYmd();
  var items = d.items.slice().sort(function(x, y){
    if(x.date !== y.date) return x.date < y.date ? -1 : 1;
    return 0;
  });
  var future = items.filter(function(x){ return isDateStr(x.date) && x.date >= t; });
  var past = items.filter(function(x){ return isDateStr(x.date) && x.date < t; });
  var undated = items.filter(function(x){ return !isDateStr(x.date); });

  var groups = [];
  future.forEach(function(it){
    var g = groups[groups.length - 1];
    if(g && g.date === it.date) g.items.push(it);
    else groups.push({ date: it.date, items: [it] });
  });

  var body = groups.length ? groups.map(function(g){
    return '<div class="ag-group">' +
      '<div class="ag-head"><span class="ag-date">' + fmtMD(g.date) + '</span>' +
        '<span class="ag-wd">' + weekday(g.date) + '</span>' + relTag(g.date) + '</div>' +
      '<ul class="ag-list' + (g.date === t ? ' today' : '') + '">' + g.items.map(function(it){
        return '<li>' + tagHTML(it.type) + '<span class="a-text">' + (esc(it.text) || '<span class="muted">（没写内容）</span>') + '</span></li>';
      }).join('') + '</ul>' +
    '</div>';
  }).join('') : emptyBox('还没有未来的安排', '#/admin', '去后台加一条');

  var counts = weekCounts(d.items, 8);
  var hot = counts.filter(function(n){ return n >= 3; }).length;
  var strip = '<section class="card">' +
    '<div class="card-head"><h2>未来 8 周</h2>' +
      '<span class="hint">' + (hot ? hot + ' 个高压周（红）' : '没有高压周') + '</span></div>' +
    weekStripHTML(counts) +
    '<p class="small muted" style="margin-top:8px">一格一周，写这周有几件事；满 3 件算「高压周」。</p>' +
  '</section>';

  var html = strip +
    '<section class="card">' +
    '<div class="card-head"><h2>接下来</h2><span class="hint">' + future.length + ' 条</span></div>' + body + '</section>';

  if(undated.length){
    html += '<section class="card"><div class="card-head"><h2>还没排期</h2><span class="hint">' + undated.length + ' 条</span></div>' +
      '<ul class="ag-list">' + undated.map(function(it){
        return '<li>' + tagHTML(it.type) + '<span class="a-text">' + esc(it.text) + '</span></li>';
      }).join('') + '</ul></section>';
  }
  if(past.length){
    html += '<details class="card past-card"><summary>已过期 · ' + past.length + ' 条</summary>' +
      '<div class="past-body"><ul class="ag-list">' + past.slice().reverse().map(function(it){
        return '<li><span class="d-chip">' + (parseYmd(it.date) ? (parseYmd(it.date).getMonth()+1) + '/' + parseYmd(it.date).getDate() : '—') + '</span>' +
          tagHTML(it.type) + '<span class="a-text">' + esc(it.text) + '</span></li>';
      }).join('') + '</ul></div></details>';
  }
  return html;
}

function viewTimetable(b){
  var d = b.data, t = todayYmd();
  var dow = parseYmd(t) ? parseYmd(t).getDay() : 1;
  var todayDay = (dow >= 1 && dow <= 5) ? dow : 0;
  var names = ['周一','周二','周三','周四','周五'];

  if(!d.slots.length){
    return '<section class="card">' + emptyBox('还没有排课，去后台一节一节填', '#/admin', '去后台') + '</section>';
  }

  var head = '<div class="tt-row tt-head"><div class="tt-period"></div>' +
    names.map(function(n, i){
      return '<div class="tt-day' + ((i + 1) === todayDay ? ' now' : '') + '">' + n + '</div>';
    }).join('') + '</div>';

  var rows = d.periods.map(function(pname, pi){
    var cells = '';
    for(var day = 1; day <= 5; day++){
      var slot = null;
      for(var k = 0; k < d.slots.length; k++){
        if(d.slots[k].period === pi && d.slots[k].day === day){ slot = d.slots[k]; break; }
      }
      cells += '<div class="tt-cell' + (day === todayDay ? ' now' : '') + '">' + (slot
        ? '<span class="tt-course">' + (esc(slot.course) || '<span class="muted">未命名</span>') + '</span>' +
          (slot.place ? '<span class="tt-place">' + esc(slot.place) + '</span>' : '')
        : '<span class="tt-empty">—</span>') + '</div>';
    }
    return '<div class="tt-row"><div class="tt-period">' + (esc(pname) || '时段') + '</div>' + cells + '</div>';
  }).join('');

  var hint = todayDay ? '今天 周' + '一二三四五'.charAt(todayDay - 1) : '今天是周末';
  return '<section class="card">' +
    '<div class="card-head"><h2>本周课表</h2><span class="hint">' + hint + '</span></div>' +
    '<div class="tt-scroll"><div class="tt">' + head + rows + '</div></div>' +
  '</section>';
}

/* ---------- 记账 ---------- */
function viewLedger(b){
  var d = b.data, now = new Date();
  var ym = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  var list = d.entries.filter(function(e){ return String(e.date).slice(0, 7) === ym; });
  var spent = list.reduce(function(s, e){ return s + (Number(e.amount) || 0); }, 0);
  var budget = Number(d.budget) || 0;
  var remain = budget - spent;
  var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  var left = dim - now.getDate() + 1;
  var perDay = left > 0 ? remain / left : 0;
  var over = remain < 0;

  var byCat = {};
  list.forEach(function(e){
    var k = e.category || '其他';
    byCat[k] = (byCat[k] || 0) + (Number(e.amount) || 0);
  });
  var catKeys = Object.keys(byCat).sort(function(a, b){ return byCat[b] - byCat[a]; });
  var catMax = catKeys.length ? byCat[catKeys[0]] : 0;

  var kpis = '<div class="led-kpis">' +
    '<div class="led-kpi"><span>本月已花</span><b>' + money(spent) + '</b></div>' +
    '<div class="led-kpi"><span>预算</span><b>' + (budget ? money(budget) : '未设置') + '</b></div>' +
    '<div class="led-kpi"><span>还剩</span><b class="' + (over ? 'neg' : '') + '">' + money(remain) + '</b></div>' +
    '<div class="led-kpi"><span>剩余 ' + left + ' 天 · 每天约</span><b class="' + (perDay < 0 ? 'neg' : '') + '">' + money(perDay) + '</b></div>' +
  '</div>';

  var cats = catKeys.length ? '<div class="led-cats">' + catKeys.map(function(k){
    return '<div class="led-cat-row">' +
      '<span class="led-cat-name">' + esc(k) + '</span>' +
      '<span class="led-cat-bar"><i style="width:' + (catMax ? Math.round(byCat[k] / catMax * 100) : 0) + '%"></i></span>' +
      '<span class="led-cat-val">' + money(byCat[k]) + '</span>' +
    '</div>';
  }).join('') + '</div>' : '<div class="empty small">' + eggIcon('whole') + '<span>这个月还没有支出</span></div>';

  var recent = list.slice().sort(function(a, c){
    return a.date === c.date ? 0 : (a.date < c.date ? 1 : -1);
  }).slice(0, 8);

  var detail = recent.length ? '<ul class="led-list">' + recent.map(function(e){
    var dm = parseYmd(e.date);
    return '<li><span class="d-chip">' + (dm ? (dm.getMonth() + 1) + '/' + dm.getDate() : '—') + '</span>' +
      tagHTML(e.category) + '<span class="a-text">' + (esc(e.text) || '（没写内容）') + '</span>' +
      '<span class="led-amt">' + money(e.amount) + '</span></li>';
  }).join('') + '</ul>' : '';

  var form = '<div class="led-add">' +
      '<input data-enter="add-ledger" data-id="' + b.id + '" placeholder="花在什么上" aria-label="支出内容">' +
      '<select data-id="' + b.id + '" aria-label="类别">' + d.categories.map(function(c){
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('') + '</select>' +
      '<input class="led-amt-in" type="number" inputmode="decimal" data-enter="add-ledger" data-id="' + b.id + '" placeholder="金额" aria-label="金额">' +
      '<button class="btn primary" data-act="add-ledger" data-id="' + b.id + '">记一笔</button>' +
    '</div>';

  return '<section class="card">' +
    '<div class="card-head"><h2>' + (now.getMonth() + 1) + ' 月账本</h2><span class="hint">' + list.length + ' 笔</span></div>' +
    kpis + cats +
  '</section>' +
  '<section class="card">' +
    '<div class="card-head"><h2>明细</h2><span class="hint">最近 ' + recent.length + ' 笔</span></div>' +
    (detail || '<div class="empty small">还没有记录</div>') +
    form +
  '</section>';
}
